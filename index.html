<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Ore Squadra</title>
<style>
:root{
  --verde:#01696f; --verde-sc:#014d52; --verde-ch:#e6f2f2;
  --sfondo:#f4f3ef; --carta:#ffffff; --testo:#1f2a2a; --grigio:#6b7676; --bordo:#d9d6cf;
  --giallo:#fff4d6; --giallo-b:#d4a017; --rosso:#b03a48; --rosso-ch:#fbe9eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--sfondo);color:var(--testo);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:700}
header.top .chi{font-size:12px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:12px 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--carta);border-top:1px solid var(--bordo);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--grigio);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--verde);font-weight:700}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:10px;padding:12px;margin-bottom:10px}
.riga{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--grigio);font-size:13px}
.big{font-size:26px;font-weight:800;color:var(--verde);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-weight:700}
button.btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
button.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
button.btn.dan{color:var(--rosso);border-color:#e3b5bb}
button.btn.full{width:100%}
button.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.navdata{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.navdata .freccia{border:1px solid var(--bordo);background:var(--carta);border-radius:8px;width:44px;height:44px;font-size:20px}
.navdata .centro{flex:1;text-align:center;position:relative}
.navdata .centro .t{font-weight:700;font-size:16px}

.turno{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.turno .barra{width:5px;align-self:stretch;border-radius:3px;background:var(--verde)}

/* Giallo: turno arrivato dall'ufficio e ancora senza nome. Sbiadito: annullato */
.turno.daass{background:var(--giallo);border-color:var(--giallo-b)}
.turno.daass .op{color:#6b4e00}

.vuoto{text-align:center;color:var(--grigio);padding:24px 8px}
.seg{display:flex;background:#e7e5df;border-radius:9px;padding:3px;margin-bottom:10px}

.cal .g .n{font-weight:700}
/* Il numero dei clienti del giorno: prima qui c'erano le ore ("91:15"), che
   prendevano tutta la larghezza. "N.7" sta largo, quindi si puo' leggere piu' grande */
.cal .g .o{margin-top:auto;font-weight:800;color:var(--verde);font-size:14px;font-variant-numeric:tabular-nums}
.cal .g.oggi{outline:2px solid var(--verde)}
.cal .g.dom .n{color:var(--rosso)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--grigio);font-weight:700;border-bottom:1px solid var(--bordo);padding:6px 4px}

/* foglio a comparsa */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
#foglio{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--carta);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;

label.f{display:block;font-size:12px;font-weight:700;color:var(--grigio);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bordo);border-radius:8px;background:#fff;color:var(--testo)}

.totbox{background:var(--verde-ch);border:1px solid var(--verde);color:var(--verde);border-radius:8px;padding:10px 12px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.totbox b{font-size:20px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--bordo);background:#fff;border-radius:7px;padding:7px 9px;font-weight:700;font-size:12px;color:var(--grigio)}
.chips button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a2a;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;display:none;max-width:90vw}
.solo-stampa{display:none}
@media print{
  header.top,nav.tabs,.no-stampa,.banner,#toast{display:none!important}
  body{padding:0;background:#fff;font-size:11px}
  main{max-width:none;padding:0}
  .card{border:0;border-bottom:1px solid #999;border-radius:0;break-inside:avoid;padding:6px 0}
  .solo-stampa{display:block}
  details>summary .chev{display:none}
}
</style>

<body>
<header class="top">
  <div><h1>Ore Squadra</h1><div class="chi" id="chi"></div></div>
  <div class="chi" id="totTop"></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-act="vista" data-v="giorno"><span class="ic">📅</span>Giorno</button>
  <button data-act="vista" data-v="mese"><span class="ic">🗓️</span>Mese</button>
  <button data-act="vista" data-v="riepilogo"><span class="ic">📊</span>Riepilogo</button>
  <button data-act="vista" data-v="liste"><span class="ic">👥</span>Liste</button>
  <button data-act="vista" data-v="altro"><span class="ic">⚙️</span>Altro</button>
</nav>
<div id="velo"></div>
<div id="foglio"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   Ore Squadra — app del capogruppo per segnare dove e quanto ha lavorato
   ognuno dei suoi. Funziona solo sul telefono: i dati stanno nel browser
   (localStorage), niente server, niente collegamenti al gestionale.
   Per non perdere nulla c'e' il backup in un file.
   ===================================================================== */
const CHIAVE = "oreSquadra.v1";
const GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const GG = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MM = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const TINTE = ["#01696f","#2a5d9f","#c78219","#8a4f9e","#b03a48","#1d8a5e","#5a6b2f","#a0522d"];

/* ---------- dati ---------- */
function vuoto(){ return { versione:1, risorse:[], servizi:[], turni:[], imp:{ nome:"", ultimoBackup:null } }; }
function carica(){
  try{
    const s = localStorage.getItem(CHIAVE);
    if(!s) return vuoto();
    const d = JSON.parse(s);
    const v = vuoto();
    return { ...v, ...d, imp:{ ...v.imp, ...(d.imp||{}) } };
  }catch(e){ return vuoto(); }
}
let db = carica();
function salva(){
  try{ localStorage.setItem(CHIAVE, JSON.stringify(db)); }
  catch(e){ alert("Attenzione: non riesco a salvare sul telefono ("+e.message+"). Fai subito un backup da Altro."); }
}
// Chiede al browser di non cancellare i dati quando il telefono e' pieno
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ---------- utilita' ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daIso = s => new Date(s+"T00:00:00");
const oggi = () => iso(new Date());
const spostaGiorno = (s,n) => { const d=daIso(s); d.setDate(d.getDate()+n); return iso(d); };
const spostaMese = (m,n) => { const [a,b]=m.split("-").map(Number); const d=new Date(a,b-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const nomeMese = m => { const [a,b]=m.split("-").map(Number); return `${MESI[b-1]} ${a}`; };
const dataLunga = s => { const d=daIso(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const dataBreve = s => { const d=daIso(s); return `${GG[d.getDay()]} ${d.getDate()} ${MM[d.getMonth()]}`; };
const aMin = t => { const [h,m]=(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
// Durata in minuti; se l'orario passa la mezzanotte (22:00-06:00) arriva al mattino dopo
const durata = (a,b) => { if(!a||!b) return 0; let m=aMin(b)-aMin(a); if(m<0) m+=1440; return m; };
const minTurno = t => durata(t.dalle,t.alle) + ((t.dalle2&&t.alle2) ? durata(t.dalle2,t.alle2) : 0);
const hm = m => `${Math.floor(m/60)}:${pad(Math.round(m%60))}`;
const decimali = m => (Math.round(m/60*100)/100).toString().replace(".",",");
const risorsa = id => db.risorse.find(r=>r.id===id);
const servizio = id => db.servizi.find(s=>s.id===id);
// Un turno senza operatore e' un turno arrivato dall'ufficio e non ancora
// assegnato: non e' un errore, e' lavoro da smistare
const nomeR = id => !id ? "Da assegnare" : (risorsa(id)?.nome || "(operatore eliminato)");
const nomeS = id => servizio(id)?.nome || "(servizio eliminato)";
/** Nome e indirizzo insieme: serve dove due negozi della stessa catena
 *  si chiamano uguale e bisogna capire di quale si parla. */
const dove = id => { const s = servizio(id); return s?.indirizzo ? `${s.nome} · ${s.indirizzo}` : nomeS(id); };
const coloreS = id => { const i=db.servizi.findIndex(s=>s.id===id); return TINTE[(i<0?0:i)%TINTE.length]; };
const orario = t => `${t.dalle}–${t.alle}` + (t.dalle2&&t.alle2 ? ` + ${t.dalle2}–${t.alle2}` : "");
const turniDel = g => db.turni.filter(t=>t.data===g).sort((a,b)=>nomeR(a.risorsaId).localeCompare(nomeR(b.risorsaId))||a.dalle.localeCompare(b.dalle));
const turniMese = m => db.turni.filter(t=>t.data.startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data)||a.dalle.localeCompare(b.dalle));
const attive = arr => arr.filter(x=>!x.nascosto).sort((a,b)=>a.nome.localeCompare(b.nome));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",2600); }

/*
 * Qui stavano due controlli: la stessa persona in due posti alla stessa ora,
 * e il tetto delle dodici ore in un giorno. Tolti tutti e due per scelta
 * dell'ufficio.
 *
 * Il motivo: il lavoro della squadra e' intestato tutto al capogruppo, quindi
 * in un giorno risultano dieci turni suoi in dieci posti diversi, e va bene
 * cosi' — il monte ore che gli si riconosce e' quello che si paga. Un avviso
 * che suona su ogni riga non e' un avviso, e' rumore.
 *
 * Restano le segnalazioni che arrivano dall'ufficio: "cambiato" e "annullato".
 * Quelle non sono giudizi dell'app, sono notizie, e si vedono ancora.
 */

/* =====================================================================
   TURNI DALL'UFFICIO
   L'ufficio manda su WhatsApp un link: i dati stanno dopo il cancelletto,
   quindi non passano da nessun server, restano nel telefono.
   Ogni turno porta l'id del gestionale (gid): e' quello che permette di
   rimandare lo stesso elenco dopo una correzione senza perdere il lavoro
   gia' fatto qui.

   Di ogni turno si tengono DUE orari:
     prev   = quello previsto dall'ufficio
     dalle/alle = quello svolto davvero, che il capogruppo puo' correggere
   Se l'ufficio cambia il previsto e lui non aveva toccato niente, si
   aggiornano tutti e due. Se invece lui aveva gia' corretto lo svolto,
   quello resta: e' la sua parola sul campo.
   ===================================================================== */

/** Da base64url ai byte */
function daBase64url(s){
  const b64 = s.replace(/-/g,"+").replace(/_/g,"/") + "=".repeat((4 - s.length % 4) % 4);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** Apre il pacchetto: "g" = compresso, "j" = testo semplice */
async function apriPacco(pacco){
  const tipo = pacco[0], corpo = daBase64url(pacco.slice(1));
  if(tipo === "j") return JSON.parse(new TextDecoder().decode(corpo));
  if(tipo !== "g") throw new Error("formato sconosciuto");
  if(!window.DecompressionStream) throw new Error("questo telefono non sa aprire i dati compressi: chiedi all'ufficio il messaggio non compresso");
  const flusso = new Blob([corpo]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(flusso).text());
}

/** Pesca il pacchetto da un link o da un messaggio incollato */
function trovaPacco(testo){
  const m = String(testo||"").match(/#imp=([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}

/**
 * Un turno sta dentro quello che l'ufficio ha mandato?
 * I pacchetti vecchi non hanno la data finale: allora vale "dal giorno X in
 * poi", come prima.
 */
const nelPeriodo = (t, dati) =>
  !!t.gid && t.data >= dati.dal && (!dati.al || t.data <= dati.al);

/**
 * Quello che l'ufficio dice di un turno: orari, nota e postazione.
 * Si tiene da parte per capire, alla spedizione dopo, cosa ha cambiato
 * l'ufficio e cosa invece ha corretto il capogruppo.
 */
const previstoDa = (n, servizioId) => ({
  dalle:n.a, alle:n.b, dalle2:n.a2||"", alle2:n.b2||"", note:n.note||"", p:servizioId||"",
});

const stessoOrario = (a,b) =>
  (a?.dalle||"")===(b?.dalle||"") && (a?.alle||"")===(b?.alle||"") &&
  (a?.dalle2||"")===(b?.dalle2||"") && (a?.alle2||"")===(b?.alle2||"");

/** L'ufficio ha cambiato qualcosa? Orari, nota o postazione. */
const stessoPrevisto = (a,b) =>
  stessoOrario(a,b) && (a?.note||"")===(b?.note||"") && (a?.p||"")===(b?.p||"");

/**
 * Guarda cosa cambierebbe, senza cambiare niente: serve a mostrare il
 * riepilogo prima di importare.
 */
function confrontaImport(dati){
  const perGid = {}; for(const t of db.turni) if(t.gid) perGid[t.gid] = t;
  const arrivati = new Set((dati.turni||[]).map(t=>t.g));
  let nuovi=0, modificati=0, invariati=0;
  for(const n of dati.turni||[]){
    const v = perGid[n.g];
    if(!v){ nuovi++; continue; }
    // Qui la postazione non si confronta: servirebbe rifare tutta la mappa
    // delle postazioni, e il conteggio e' solo un'anteprima
    const prev = previstoDa(n, v.servizioId);
    if(stessoPrevisto(v.prev, prev) && v.data===n.d && !v.statoUff) invariati++; else modificati++;
  }
  // Spariti. In un messaggio COMPLETO si capisce dal silenzio: c'erano, stanno
  // nel periodo mandato, e stavolta non arrivano. In uno PARZIALE il silenzio
  // vuol dire "non e' cambiato", quindi le cancellazioni l'ufficio le dice per
  // nome nella lista `rimossi`.
  const annullati = dati.parziale
    ? db.turni.filter(t => t.gid && (dati.rimossi||[]).includes(t.gid) && t.statoUff !== "annullato").length
    : db.turni.filter(t => nelPeriodo(t, dati) && !arrivati.has(t.gid) && t.statoUff !== "annullato").length;
  return { nuovi, modificati, invariati, annullati };
}

/** Applica davvero. Torna il riepilogo di quello che ha fatto. */
function applicaImport(dati){
  const esito = { nuovi:0, modificati:0, invariati:0, annullati:0, risorse:0, servizi:0 };

  const uguale = (a,b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();

  // ── Le persone della squadra ──────────────────────────────────────────
  // Si cerca prima per id del gestionale. Il nome e' solo un ripiego, per
  // agganciare chi il capogruppo aveva gia' scritto a mano, e vale una volta
  // sola: due persone con lo stesso nome non devono diventare una.
  const perOp = {}, risUsate = new Set();
  for(const o of dati.squadra||[]){
    let r = db.risorse.find(x=>x.gid===o.id)
         || db.risorse.find(x=>!x.gid && !risUsate.has(x.id) && uguale(x.nome,o.n));
    if(!r){ r = { id:uid(), nome:o.n, tel:"", nascosto:false, gid:o.id }; db.risorse.push(r); esito.risorse++; }
    if(!r.gid) r.gid = o.id;
    risUsate.add(r.id);
    perOp[o.id] = r.id;
  }

  // ── Le postazioni ─────────────────────────────────────────────────────
  // Stessa regola, e qui conta davvero: della stessa catena arrivano piu'
  // negozi con lo stesso nome e indirizzi diversi. Se si agganciassero per
  // nome diventerebbero un negozio solo e le ore finirebbero tutte li'.
  const perPost = {}, serUsati = new Set();
  for(const p of dati.postazioni||[]){
    let s = (p.k ? db.servizi.find(x=>x.gid===p.k) : null)
         || db.servizi.find(x=>!x.gid && !serUsati.has(x.id) && uguale(x.nome,p.n) && (!x.indirizzo || !p.i || uguale(x.indirizzo,p.i)));
    if(!s){
      // Il nome resta quello del cliente, anche se un altro negozio si chiama
      // uguale: a distinguerli ci pensa l'indirizzo, che si mostra sempre
      // accanto al nome. Attaccarlo dentro al nome faceva due righe diverse —
      // "ACTION" e "ACTION · Via Lorenteggio" — per due cose dello stesso tipo.
      s = { id:uid(), nome:p.n, indirizzo:p.i||"", dalle:"", alle:"", dalle2:"", alle2:"", orePreviste:"", nascosto:false, gid:p.k||null };
      db.servizi.push(s); esito.servizi++;
    }
    if(!s.gid && p.k) s.gid = p.k;
    if(!s.indirizzo && p.i) s.indirizzo = p.i;
    // Postazioni create dalla versione di prima, con l'indirizzo dentro al
    // nome: si rimette a posto il nome, l'indirizzo e' gia' nel suo campo
    if(p.i && s.nome === `${p.n} · ${p.i}`) s.nome = p.n;
    serUsati.add(s.id);
    perPost[p.p] = s.id;
  }

  // ── I turni ───────────────────────────────────────────────────────────
  const perGid = {}; for(const t of db.turni) if(t.gid) perGid[t.gid] = t;
  const arrivati = new Set();

  for(const n of dati.turni||[]){
    arrivati.add(n.g);
    const prev = previstoDa(n, perPost[n.p]);
    const v = perGid[n.g];

    if(!v){
      // Il turno arriva gia' intestato a chi lo ha nel gestionale — di norma
      // il capogruppo stesso, perche' e' a lui che l'ufficio assegna tutto il
      // lavoro della squadra. Poi lui gira agli altri quello che non fa di
      // persona, con "Assegna in blocco".
      db.turni.push({
        id:uid(), gid:n.g, data:n.d, servizioId:perPost[n.p]||"",
        risorsaId: (n.o && perOp[n.o]) || "",
        dalle:prev.dalle, alle:prev.alle, dalle2:prev.dalle2, alle2:prev.alle2,
        note:n.note||"", prev, statoUff:"",
        // "uff" = il nome e' ancora quello dell'ufficio, il capogruppo non
        // l'ha ancora smistato. Non si vede a schermo: e' la traccia di
        // cosa ha gia' guardato, se un domani serve.
        uff: 1,
      });
      esito.nuovi++;
      continue;
    }

    // Turni entrati prima che esistesse il segno "uff": se hanno ancora in
    // faccia il nome che manda l'ufficio, vuol dire che non li ha smistati lui.
    if(v.uff === undefined && n.o && v.risorsaId === perOp[n.o]) v.uff = 1;

    // Cambiato dall'ufficio: orari, giorno, nota o postazione
    const cambiato = !stessoPrevisto(v.prev, prev) || v.data !== n.d;
    // Lo svolto lo si tocca solo se lui non l'aveva gia' corretto
    const orariNonToccati = !v.prev || stessoOrario(v, v.prev);
    const notaNonToccata = !v.prev || (v.note||"") === (v.prev.note||"");
    v.data = n.d;
    v.servizioId = perPost[n.p] || v.servizioId;
    if(notaNonToccata) v.note = prev.note;
    if(orariNonToccati){ v.dalle=prev.dalle; v.alle=prev.alle; v.dalle2=prev.dalle2; v.alle2=prev.alle2; }
    v.prev = prev;
    v.statoUff = cambiato ? "modificato" : "";
    if(cambiato) esito.modificati++; else esito.invariati++;
  }

  // ── Quelli spariti: non si cancellano da soli, li conferma lui ────────
  // Messaggio parziale: le cancellazioni arrivano scritte per nome.
  // Messaggio completo: si deducono dal silenzio, ma solo dentro il periodo
  // mandato — quello che sta fuori non e' stato annullato, semplicemente
  // l'ufficio stavolta non lo ha mandato.
  const spariti = dati.parziale
    ? db.turni.filter(t => t.gid && (dati.rimossi||[]).includes(t.gid))
    : db.turni.filter(t => nelPeriodo(t, dati) && !arrivati.has(t.gid));
  for(const t of spariti){
    if(t.statoUff !== "annullato"){ t.statoUff = "annullato"; esito.annullati++; }
  }

  if(!db.imp.nome && dati.capo) db.imp.nome = dati.capo;
  // Chi e' il capogruppo fra le risorse: serve a "Assegna in blocco", che
  // parte da lui perche' e' a lui che l'ufficio intesta tutto
  if(dati.capoId && perOp[dati.capoId]) db.imp.capoRisorsa = perOp[dati.capoId];
  db.imp.ultimoImport = { quando:new Date().toISOString(), dal:dati.dal, turni:(dati.turni||[]).length };
  salva();
  return esito;
}

/**
 * Passa una serie di turni da una persona a un'altra, in un colpo solo.
 *
 * L'ufficio intesta tutto il lavoro della squadra al capogruppo: il suo
 * mestiere e' girarne una parte ai ragazzi. Quindi qui si sceglie da chi si
 * prende e a chi si da', e si restringe per postazione, giorni della
 * settimana e periodo.
 */
function foglioAssegna(){
  const vivi = db.turni.filter(t=>t.statoUff!=="annullato");
  // Si parte da chi ne ha di piu': di norma il capogruppo
  const conteggi = {};
  for(const t of vivi) conteggi[t.risorsaId||"0"] = (conteggi[t.risorsaId||"0"]||0) + 1;
  const partenza = db.imp.capoRisorsa && conteggi[db.imp.capoRisorsa]
    ? db.imp.capoRisorsa
    : Object.keys(conteggi).sort((a,b)=>conteggi[b]-conteggi[a])[0] || "0";
  const date = vivi.map(t=>t.data).sort();

  const vociDa = [`<option value="">Chiunque (${vivi.length})</option>`,
    `<option value="0" ${partenza==="0"?"selected":""}>Da assegnare (${conteggi["0"]||0})</option>`,
    ...attive(db.risorse).filter(r=>conteggi[r.id])
      .map(r=>`<option value="${r.id}" ${partenza===r.id?"selected":""}>${esc(r.nome)} (${conteggi[r.id]})</option>`)].join("");

  apriFoglio(`<h2>Assegna in blocco</h2>
    <p class="muted" style="margin-top:0">Sposta tanti turni da una persona a un'altra. Scegli da chi, a chi, e su quali.</p>
    <label class="f">Adesso sono di</label><select class="i" id="aDa">${vociDa}</select>
    <label class="f">Passali a</label><select class="i" id="aRis"><option value="">— scegli —</option>${attive(db.risorse).map(r=>`<option value="${r.id}">${esc(r.nome)}</option>`).join("")}</select>
    <label class="f">Postazione</label><select class="i" id="aSer"><option value="">Tutte</option>${
      [...new Set(vivi.map(t=>t.servizioId))].sort((a,b)=>dove(a).localeCompare(dove(b)))
        .map(s=>`<option value="${s}">${esc(dove(s))}</option>`).join("")}</select>
    <label class="f">Solo questi giorni della settimana</label>
    <div class="chips" id="aGiorni">${[1,2,3,4,5,6,0].map(d=>`<button class="on" data-act="chipA" data-d="${d}">${GG[d]}</button>`).join("")}</div>
    <div class="due"><div><label class="f">Dal</label><input class="i" type="date" id="aDal" value="${date[0]||oggi()}"></div>
      <div><label class="f">Al</label><input class="i" type="date" id="aAl" value="${date[date.length-1]||oggi()}"></div></div>
    <div class="totbox"><span>Turni che verranno spostati</span><b id="aConta">0</b></div>
    <div class="btns" style="margin-top:14px"><button class="btn" data-act="chiudi">Annulla</button><button class="btn pri" data-act="faiAssegna">Assegna</button></div>`);
  contaAssegna();
}
function turniDaAssegnare(){
  const da = val("aDa"), ser = val("aSer"), dal = val("aDal"), al = val("aAl");
  const gg = [...document.querySelectorAll("#aGiorni button.on")].map(b=>Number(b.dataset.d));
  return db.turni.filter(t => t.statoUff!=="annullato"
    // "" = chiunque · "0" = solo quelli senza nome · altrimenti quella persona
    && (da === "" || (da === "0" ? !t.risorsaId : t.risorsaId === da))
    && (!ser || t.servizioId===ser)
    && (!dal || t.data>=dal) && (!al || t.data<=al)
    && gg.includes(daIso(t.data).getDay()));
}
function contaAssegna(){ const e=document.getElementById("aConta"); if(e) e.textContent = turniDaAssegnare().length; }

function bannerBackup(){
  if(!db.turni.length) return "";
  const u = db.imp.ultimoBackup;
  const giorni = u ? Math.floor((Date.now()-new Date(u).getTime())/86400000) : null;
  if(giorni!==null && giorni<7) return "";
  return `<div class="banner no-stampa"><span>💾</span><span class="sp">${u?`Ultimo backup ${giorni} giorni fa.`:"Non hai ancora fatto un backup."} Se perdi il telefono perdi le ore.</span><button class="btn" data-act="backup">Salva</button></div>`;
}

      })()}</div></div>`;
  if(!lista.length) h += `<div class="card vuoto">Nessun turno in questo giorno.</div>`;
  for(const t of lista){
    const daAssegnare = !t.risorsaId;
    const annullato = t.statoUff === "annullato";
    h += `<div class="card turno ${daAssegnare?"daass":""} ${annullato?"annull":""}" data-act="modifica" data-id="${t.id}">
      <div class="barra" style="background:${coloreS(t.servizioId)}"></div>
      <div class="sp"><div class="op">${esc(nomeR(t.risorsaId))}</div>
        <div>${esc(nomeS(t.servizioId))}</div>

        <div class="muted">${esc(orario(t))}${t.note?` · ${esc(t.note)}`:""}</div>
        ${annullato ? `<div class="avviso">✕ Annullato dall'ufficio — aprilo e togli il turno</div>` : ""}
        ${t.statoUff==="modificato" ? `<div class="avviso">✎ Cambiato dall'ufficio: previsto ${esc(orario(t.prev||{}))}</div>` : ""}</div>
      <div class="ore">${hm(minTurno(t))}</div></div>`;
  }
  const daAss = db.turni.filter(x=>!x.risorsaId && x.statoUff!=="annullato").length;
  h += `<button class="btn pri full" data-act="nuovo" style="margin:4px 0 8px">+ Aggiungi turno</button>`;
  // Serve sempre: l'ufficio intesta tutto al capogruppo, e il suo lavoro e'

  if(db.turni.length) h += `<button class="btn full" data-act="assegna" style="margin-bottom:8px">👤 Assegna in blocco${daAss?` (${daAss} da assegnare)`:""}</button>`;
  h += `<div class="btns"><button class="btn" data-act="copiaieri">Copia da ieri</button><button class="btn" data-act="ripeti" ${lista.length?"":"disabled"}>Ripeti su più giorni</button></div>`;
  return h;

/* ---------- vista MESE ---------- */
function vistaMese(){
  const m = stato.mese, [a,b] = m.split("-").map(Number);
  const primo = new Date(a,b-1,1), nGiorni = new Date(a,b,0).getDate();
  const lista = turniMese(m);
  const perGiorno = {}; for(const t of lista) perGiorno[t.data]=(perGiorno[t.data]||0)+minTurno(t);
  // Nel calendario non vanno le ore ma QUANTI CLIENTI ci sono quel giorno:
  // e' il numero che dice al capogruppo quanti posti deve coprire. Le ore
  // restano, in grande, toccando il giorno.
  const clientiGiorno = {};
  for(const t of lista) (clientiGiorno[t.data] ||= new Set()).add(t.servizioId);
  const tot = lista.reduce((s,t)=>s+minTurno(t),0);
  let h = navMese() + `<div class="card riga"><div><div class="muted">Totale ore del mese</div><div class="big">${hm(tot)}</div></div><div class="sp"></div>
    <div class="muted" style="text-align:right">${lista.length} turni<br>${Object.keys(perGiorno).length} giorni lavorati</div></div>
    <div class="cal">${["L","M","M","G","V","S","D"].map(x=>`<div class="h">${x}</div>`).join("")}`;
  for(let i=0;i<(primo.getDay()+6)%7;i++) h+=`<div class="g vuota"></div>`;
  for(let d=1; d<=nGiorni; d++){
    const g = `${m}-${pad(d)}`, dt=daIso(g);
    const nCli = clientiGiorno[g]?.size || 0;
    h += `<div class="g ${g===oggi()?"oggi":""} ${dt.getDay()===0?"dom":""}" data-act="apri" data-g="${g}"`
      + ` title="${nCli?`${nCli} client${nCli===1?"e":"i"} · ${hm(perGiorno[g])} ore`:"niente"}">`
      + `<span class="n">${d}</span>${nCli?`<span class="o">N.${nCli}</span>`:""}</div>`;
  }
  return h + `</div><p class="muted" style="text-align:center"><b>N.</b> è quanti clienti ci sono quel giorno. Tocca un giorno per vedere i turni e le ore.</p>`;
}
function navMese(){
  return `<div class="navdata no-stampa"><button class="freccia" data-act="mese" data-n="-1">‹</button>
    <div class="centro"><div class="t" style="text-transform:capitalize">${nomeMese(stato.mese)}</div>
    <input type="month" value="${stato.mese}" data-act-change="sceglimese"></div>
    <button class="freccia" data-act="mese" data-n="1">›</button></div>`;
}

/* ---------- vista RIEPILOGO ---------- */
function vistaRiepilogo(){
  const m = stato.mese, lista = turniMese(m);
  let h = navMese() + `<div class="seg no-stampa"><button class="${stato.riep==="op"?"on":""}" data-act="riep" data-v="op">Per operatore</button><button class="${stato.riep==="serv"?"on":""}" data-act="riep" data-v="serv">Per servizio</button></div>
    <div class="solo-stampa"><h2 style="margin:0">Ore ${stato.riep==="op"?"per operatore":"per servizio"} — <span style="text-transform:capitalize">${nomeMese(m)}</span></h2><p>${esc(db.imp.nome?("Capogruppo: "+db.imp.nome):"")}</p></div>`;
  if(!lista.length) return h + `<div class="card vuoto">Nessun turno in ${nomeMese(m)}.</div>`;
  h += stato.riep==="op" ? riepOperatori(lista) : riepServizi(lista);
  h += `<div class="btns no-stampa" style="margin-top:6px"><button class="btn" data-act="csv">📄 Excel del mese</button><button class="btn" data-act="stampa">🖨️ Stampa / PDF</button></div>`;
  return h;
}
function riepOperatori(lista){
  const per = {};
  for(const t of lista){ (per[t.risorsaId] ||= []).push(t); }
  const ids = Object.keys(per).sort((a,b)=>nomeR(a).localeCompare(nomeR(b)));
  let h = "";
  for(const id of ids){
    const ts = per[id], tot = ts.reduce((s,t)=>s+minTurno(t),0);
    const giorni = {}; for(const t of ts) (giorni[t.data] ||= []).push(t);
    let righe = "";
    for(const g of Object.keys(giorni).sort()){
      const gt = giorni[g], totG = gt.reduce((s,t)=>s+minTurno(t),0);
      gt.forEach((t,i)=>{
        righe += `<tr>${i===0?`<td rowspan="${gt.length}">${esc(dataBreve(g))}</td>`:""}
          <td>${esc(nomeS(t.servizioId))}${servizio(t.servizioId)?.indirizzo?`<div class="muted">${esc(servizio(t.servizioId).indirizzo)}</div>`:""}</td>
          <td class="r">${esc(orario(t)).replace(" + ","<br>")}</td>
          ${i===0?`<td class="r num" rowspan="${gt.length}">${hm(totG)}</td>`:""}</tr>`;
      });
    }
    h += `<details class="card"><summary class="riga"><span class="chev">▶</span><div class="sp"><div class="op" style="font-weight:700">${esc(nomeR(id))}</div>
        <div class="muted">${Object.keys(giorni).length} giorni · ${ts.length} turni</div></div><div class="big" style="font-size:22px">${hm(tot)}</div></summary>
      <table class="t" style="margin-top:8px"><tr><th>Giorno</th><th>Dove</th><th class="r">Orario</th><th class="r">Tot giorno</th></tr>${righe}
      <tr class="tot"><td colspan="3">Totale mese</td><td class="r">${hm(tot)}</td></tr></table></details>`;
  }
  const totale = lista.reduce((s,t)=>s+minTurno(t),0);
  return h + `<div class="card riga"><b class="sp">Totale squadra</b><span class="big" style="font-size:22px">${hm(totale)}</span></div>`;
}
function riepServizi(lista){
  const per = {};
  for(const t of lista){ (per[t.servizioId] ||= []).push(t); }
  const ids = Object.keys(per).sort((a,b)=>nomeS(a).localeCompare(nomeS(b)));
  let h = "";
  for(const id of ids){
    const ts = per[id], tot = ts.reduce((s,t)=>s+minTurno(t),0), s = servizio(id);
    const perOp = {}; for(const t of ts) perOp[t.risorsaId]=(perOp[t.risorsaId]||0)+minTurno(t);
    let prev = "";
    if(s && s.orePreviste){
      const diff = tot - s.orePreviste*60;
      const col = Math.abs(diff)<1 ? "#1d8a5e" : (diff<0 ? "#c78219" : "#b03a48");
      prev = `<div style="color:${col};font-size:13px;font-weight:700">Previste ${hm(s.orePreviste*60)} · ${Math.abs(diff)<1?"✓ in linea":(diff<0?`mancano ${hm(-diff)}`:`in più ${hm(diff)}`)}</div>`;
    }
    h += `<details class="card"><summary class="riga"><span class="chev">▶</span><span style="width:10px;height:10px;border-radius:50%;background:${coloreS(id)}"></span>
        <div class="sp"><div style="font-weight:700">${esc(nomeS(id))}</div>${s?.indirizzo?`<div class="muted">${esc(s.indirizzo)}</div>`:""}${prev}</div>
        <div class="big" style="font-size:22px">${hm(tot)}</div></summary>
      <table class="t" style="margin-top:8px"><tr><th>Operatore</th><th class="r">Ore</th></tr>
      ${Object.keys(perOp).sort((a,b)=>nomeR(a).localeCompare(nomeR(b))).map(o=>`<tr><td>${esc(nomeR(o))}</td><td class="r num">${hm(perOp[o])}</td></tr>`).join("")}
      <tr class="tot"><td>Totale</td><td class="r">${hm(tot)}</td></tr></table></details>`;
  }
  return h;
}

/* ---------- vista LISTE ---------- */
function vistaListe(){
  const r = stato.liste==="risorse";
  const arr = (r?db.risorse:db.servizi).slice().sort((a,b)=>(!!a.nascosto-!!b.nascosto)||a.nome.localeCompare(b.nome));

  if(!arr.length) h += `<div class="vuoto">Ancora nessun${r?"a risorsa":" servizio"}.</div>`;
  for(const x of arr){
    const n = db.turni.filter(t=>r?t.risorsaId===x.id:t.servizioId===x.id).length;
    h += `<div class="lista-el" data-act="${r?"modR":"modS"}" data-id="${x.id}">${r?"":`<span style="width:10px;height:10px;border-radius:50%;background:${coloreS(x.id)}"></span>`}

  }
  return h + `</div>`;
}

/* Turno: nuovo o modifica */
function foglioTurno(t){
  const nuovo = !t;
  t = t || { data:stato.giorno, risorsaId:"", servizioId:"", dalle:"", alle:"", dalle2:"", alle2:"", note:"" };
  const ris = attive(db.risorse), ser = attive(db.servizi);
  // in modifica la persona o il servizio nascosti devono restare scelti
  if(t.risorsaId && !ris.find(r=>r.id===t.risorsaId) && risorsa(t.risorsaId)) ris.push(risorsa(t.risorsaId));
  if(t.servizioId && !ser.find(s=>s.id===t.servizioId) && servizio(t.servizioId)) ser.push(servizio(t.servizioId));
  const doppio = !!(t.dalle2||t.alle2);
  apriFoglio(`<h2>${nuovo?"Nuovo turno":"Modifica turno"}</h2>
    <label class="f">Giorno</label><input class="i" type="date" id="tData" value="${t.data}">
    <label class="f">Chi va a lavorare</label><select class="i" id="tRis"><option value="">— scegli —</option>${ris.map(r=>`<option value="${r.id}" ${r.id===t.risorsaId?"selected":""}>${esc(r.nome)}</option>`).join("")}</select>
    <label class="f">Dove (servizio)</label><select class="i" id="tSer"><option value="">— scegli —</option>${ser.map(s=>`<option value="${s.id}" ${s.id===t.servizioId?"selected":""}>${esc(dove(s.id))}</option>`).join("")}</select>
    <div class="due"><div><label class="f">Dalle</label><input class="i" type="time" id="tDa" value="${t.dalle}"></div><div><label class="f">Alle</label><input class="i" type="time" id="tA" value="${t.alle}"></div></div>
    <label class="check"><input type="checkbox" id="tDoppio" ${doppio?"checked":""}> Secondo turno nello stesso giorno</label>
    <div class="due" id="boxDoppio" style="display:${doppio?"grid":"none"}"><div><label class="f">Dalle 2</label><input class="i" type="time" id="tDa2" value="${t.dalle2||""}"></div><div><label class="f">Alle 2</label><input class="i" type="time" id="tA2" value="${t.alle2||""}"></div></div>
    <label class="f">Note (facoltative)</label><input class="i" id="tNote" value="${esc(t.note||"")}" placeholder="Es. sostituisce Op2">
    ${t.gid ? `<div class="banner" style="margin:10px 0 0"><span>📨</span><span class="sp">
      ${t.statoUff==="annullato" ? "<b>Annullato dall'ufficio.</b> Se non si è lavorato, elimina il turno."
        : t.statoUff==="modificato" ? `<b>Cambiato dall'ufficio.</b> Previsto: ${esc(orario(t.prev||{}))}`
        : `Turno dell'ufficio · previsto ${esc(orario(t.prev||{}))}`}
      ${t.prev && !stessoOrario(t, t.prev) ? "<br>Gli orari qui sotto sono quelli che hai corretto tu: restano." : ""}
    </span></div>` : ""}
    <div class="totbox"><span>Totale ore giornata</span><b id="tTot">0:00</b></div>
    <div class="btns" style="margin-top:14px">${nuovo?"":`<button class="btn dan" data-act="eliminaT" data-id="${t.id}">Elimina</button>`}<button class="btn" data-act="chiudi">Annulla</button><button class="btn pri" data-act="salvaT" data-id="${nuovo?"":t.id}">Salva</button></div>`);
  aggiornaTotTurno();
}
function leggiTurno(){
  const doppio = document.getElementById("tDoppio").checked;
  return { data:val("tData"), risorsaId:val("tRis"), servizioId:val("tSer"), dalle:val("tDa"), alle:val("tA"),

}
function aggiornaTotTurno(){
  document.getElementById("tTot").textContent = hm(minTurno(leggiTurno()));
}

/* Ripeti il giorno su un periodo */
function foglioRipeti(){
  const g = stato.giorno, fine = spostaGiorno(g,6);
  apriFoglio(`<h2>Ripeti su più giorni</h2>
    <p class="muted" style="margin-top:0">Copia i ${turniDel(g).length} turni di <b>${esc(dataBreve(g))}</b> sui giorni scelti.</p>
    <div class="due"><div><label class="f">Dal</label><input class="i" type="date" id="rDal" value="${spostaGiorno(g,1)}"></div><div><label class="f">Al</label><input class="i" type="date" id="rAl" value="${fine}"></div></div>
    <label class="f">Solo questi giorni della settimana</label>
    <div class="chips" id="rGiorni">${[1,2,3,4,5,6,0].map(d=>`<button class="on" data-act="chip" data-d="${d}">${GG[d]}</button>`).join("")}</div>
    <label class="check"><input type="checkbox" id="rSalta" checked> Salta i giorni che hanno già dei turni</label>
    <div class="totbox"><span>Giorni che verranno compilati</span><b id="rConta">0</b></div>
    <div class="btns" style="margin-top:14px"><button class="btn" data-act="chiudi">Annulla</button><button class="btn pri" data-act="faiRipeti">Copia</button></div>`);
  contaRipeti();
}
function giorniRipeti(){
  const dal=val("rDal"), al=val("rAl"); if(!dal||!al||al<dal) return [];
  const ok = [...document.querySelectorAll("#rGiorni button.on")].map(b=>Number(b.dataset.d));
  const salta = document.getElementById("rSalta").checked, out=[];
  for(let g=dal; g<=al && out.length<370; g=spostaGiorno(g,1)){
    if(g===stato.giorno) continue;
    if(!ok.includes(daIso(g).getDay())) continue;
    if(salta && db.turni.some(t=>t.data===g)) continue;
    out.push(g);
  }
  return out;
}
function contaRipeti(){ document.getElementById("rConta").textContent = giorniRipeti().length; }

/* ---------- file: backup, ripristino, Excel ---------- */
async function consegnaFile(nome, contenuto, tipo){
  const blob = new Blob([contenuto], { type:tipo });
  // Sul telefono, se si puo', si apre "Condividi" (WhatsApp, mail, Drive...)
  try{
    const file = new File([blob], nome, { type:tipo });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:nome }); return true; }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function backup(){
  const ok = await consegnaFile(`ore-squadra-backup-${oggi()}.json`, JSON.stringify(db,null,1), "application/json");
  if(ok){ db.imp.ultimoBackup = new Date().toISOString(); salva(); render(); toast("Backup salvato"); }
}
function ripristina(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!Array.isArray(d.turni) || !Array.isArray(d.risorse) || !Array.isArray(d.servizi)) throw new Error("non è un backup di Ore Squadra");
      if(!confirm(`Il backup contiene ${d.risorse.length} risorse, ${d.servizi.length} servizi e ${d.turni.length} turni.\nSostituisce TUTTI i dati attuali. Continuo?`)) return;
      const v = vuoto(); db = { ...v, ...d, imp:{ ...v.imp, ...(d.imp||{}) } }; salva(); render(); toast("Backup ripristinato");
    }catch(e){ alert("File non valido: "+e.message); }
  };
  fr.readAsText(file);
}
function csvMese(){
  const m = stato.mese, lista = turniMese(m);
  if(!lista.length){ toast(`Nessun turno in ${nomeMese(m)}`); return; }
  const c = v => { const s=String(v??""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  // Totale del giorno per persona, ripetuto su ogni riga di quel giorno
  const totGiorno = {}; for(const t of lista){ const k=t.risorsaId+"|"+t.data; totGiorno[k]=(totGiorno[k]||0)+minTurno(t); }
  const righe = [["Capogruppo","Data","Giorno","Operatore","Servizio","Indirizzo","Dalle","Alle","Dalle 2","Alle 2","Ore turno","Ore turno (decimali)","Tot giorno operatore","Note"]];
  for(const t of lista){
    righe.push([db.imp.nome, t.data.split("-").reverse().join("/"), GIORNI[daIso(t.data).getDay()], nomeR(t.risorsaId), nomeS(t.servizioId), servizio(t.servizioId)?.indirizzo||"",
      t.dalle, t.alle, t.dalle2||"", t.alle2||"", hm(minTurno(t)), decimali(minTurno(t)), hm(totGiorno[t.risorsaId+"|"+t.data]), t.note||""]);
  }
  // Totali del mese per operatore in fondo
  righe.push([]); righe.push(["","","","TOTALI DEL MESE","","","","","","","Ore","Ore (decimali)"]);
  const per={}; for(const t of lista) per[t.risorsaId]=(per[t.risorsaId]||0)+minTurno(t);
  Object.keys(per).sort((a,b)=>nomeR(a).localeCompare(nomeR(b))).forEach(id=>righe.push(["","","",nomeR(id),"","","","","","",hm(per[id]),decimali(per[id])]));
  const testo = "﻿" + righe.map(r=>r.map(c).join(";")).join("\r\n");
  consegnaFile(`ore-squadra-${m}${db.imp.nome?"-"+db.imp.nome.replace(/[^\w]+/g,"_"):""}.csv`, testo, "text/csv");
}

/* ---------- azioni ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case "vista": stato.vista = el.dataset.v; if(stato.vista==="giorno"&&!stato.giorno) stato.giorno=oggi(); render(); break;
    case "giorno": stato.giorno = spostaGiorno(stato.giorno, Number(el.dataset.n)); render(); break;
    case "mese": stato.mese = spostaMese(stato.mese, Number(el.dataset.n)); render(); break;
    case "apri": stato.giorno = el.dataset.g; stato.vista="giorno"; render(); break;
    case "riep": stato.riep = el.dataset.v; render(); break;
    case "liste": stato.liste = el.dataset.v; render(); break;
    case "chiudi": chiudiFoglio(); break;
    case "nuovo": foglioTurno(null); break;
    case "modifica": foglioTurno(db.turni.find(t=>t.id===id)); break;
    case "salvaT": {
      const t = leggiTurno();
      if(!t.data||!t.risorsaId||!t.servizioId||!t.dalle||!t.alle){ toast("Compila giorno, persona, servizio, dalle e alle"); return; }
      if(t.dalle===t.alle){ toast("Dalle e Alle sono uguali"); return; }
      if((t.dalle2&&!t.alle2)||(!t.dalle2&&t.alle2)){ toast("Secondo turno: servono sia Dalle 2 che Alle 2"); return; }
      if(id){
        const v = db.turni.find(x=>x.id===id);
        Object.assign(v, t);
        // Aprendolo e salvandolo se n'e' preso carico: il nome adesso e' suo
        delete v.uff;
        // Se l'ufficio aveva segnalato una modifica, aprendolo e salvando
        // l'ha vista: il segno si toglie. L'annullato invece resta finche'
        // non elimina il turno.
        if(v.statoUff === "modificato") v.statoUff = "";
      } else { db.turni.push({ id:uid(), ...t }); }
      salva(); chiudiFoglio(); stato.giorno = t.data; stato.mese = t.data.slice(0,7); render(); toast("Turno salvato"); break; }
    case "eliminaT": if(confirm("Elimino questo turno?")){ db.turni = db.turni.filter(t=>t.id!==id); salva(); chiudiFoglio(); render(); } break;
    case "copiaieri": {
      const ieri = turniDel(spostaGiorno(stato.giorno,-1));
      if(!ieri.length){ toast("Il giorno prima non ha turni"); return; }
      if(turniDel(stato.giorno).length && !confirm("Questo giorno ha già dei turni: aggiungo anche quelli di ieri?")) return;
      ieri.forEach(t=>db.turni.push({ ...t, id:uid(), data:stato.giorno })); salva(); render(); toast(`Copiati ${ieri.length} turni`); break; }
    case "ripeti": foglioRipeti(); break;
    case "chip": el.classList.toggle("on"); contaRipeti(); break;
    case "chipA": el.classList.toggle("on"); contaAssegna(); break;
    case "assegna": foglioAssegna(); break;
    case "faiAssegna": {
      const chi = val("aRis");
      if(!chi){ toast("Scegli a chi li passi"); return; }
      const ts = turniDaAssegnare().filter(t=>t.risorsaId !== chi);
      if(!ts.length){ toast("Nessun turno da spostare con questi filtri"); return; }
      const da = val("aDa");
      const chiEra = da === "" ? "" : da === "0" ? " da «Da assegnare»" : ` da ${nomeR(da)}`;
      if(!confirm(`Passo ${ts.length} turni${chiEra} a ${nomeR(chi)}?`)) return;
      // Smistati da lui: il nome non e' piu' quello messo dall'ufficio
      ts.forEach(t=>{ t.risorsaId = chi; delete t.uff; });
      salva(); chiudiFoglio(); render(); toast(`${ts.length} turni passati a ${nomeR(chi)}`); break; }
    case "leggiIncollato": {
      const pacco = trovaPacco(val("incolla"));
      if(!pacco){ toast("Nel testo non trovo i turni: incolla tutto il messaggio"); return; }
      caricaPacco(pacco); break; }
    case "faiImport": {
      if(!paccoInAttesa){ toast("Niente da importare"); return; }
      const e = applicaImport(paccoInAttesa);
      paccoInAttesa = null;
      chiudiFoglio();
      if(e.nuovi) { stato.vista = "giorno"; }
      render();
      toast(`${e.nuovi} nuovi · ${e.modificati} cambiati · ${e.annullati} annullati`);
      break; }
    case "faiRipeti": {
      const giorni = giorniRipeti(), base = turniDel(stato.giorno);
      if(!giorni.length){ toast("Nessun giorno da compilare"); return; }
      giorni.forEach(g=>base.forEach(t=>db.turni.push({ ...t, id:uid(), data:g })));
      salva(); chiudiFoglio(); render(); toast(`Copiati su ${giorni.length} giorni`); break; }
    case "nuovaR": foglioRisorsa(null); break;
    case "modR": foglioRisorsa(risorsa(id)); break;
    case "salvaR": {
      const nome = val("rNome"); if(!nome){ toast("Scrivi il nome"); return; }
      const dati = { nome, tel:val("rTel"), nascosto: !!document.getElementById("rNasc")?.checked };
      if(id) Object.assign(risorsa(id), dati); else db.risorse.push({ id:uid(), ...dati });
      salva(); chiudiFoglio(); render(); break; }
    case "eliminaR": {
      const n = db.turni.filter(t=>t.risorsaId===id).length;
      if(n){ alert(`Non si può eliminare: ha ${n} turni registrati.\nSpunta "Nascondi" se non lavora più con te.`); return; }
      if(confirm("Elimino questa risorsa?")){ db.risorse = db.risorse.filter(r=>r.id!==id); salva(); chiudiFoglio(); render(); } break; }
    case "nuovoS": foglioServizio(null); break;
    case "modS": foglioServizio(servizio(id)); break;
    case "salvaS": {
      const nome = val("sNome"); if(!nome){ toast("Scrivi il nome del servizio"); return; }
      const dati = { nome, indirizzo:val("sInd"), dalle:val("sDa"), alle:val("sA"), dalle2:val("sDa2"), alle2:val("sA2"),
        orePreviste: parseFloat(val("sPrev").replace(",", "."))||"", nascosto: !!document.getElementById("sNasc")?.checked };
      if(id) Object.assign(servizio(id), dati); else db.servizi.push({ id:uid(), ...dati });
      salva(); chiudiFoglio(); render(); break; }
    case "eliminaS": {
      const n = db.turni.filter(t=>t.servizioId===id).length;
      if(n){ alert(`Non si può eliminare: ha ${n} turni registrati.\nSpunta "Nascondi" se il servizio è finito.`); return; }
      if(confirm("Elimino questo servizio?")){ db.servizi = db.servizi.filter(s=>s.id!==id); salva(); chiudiFoglio(); render(); } break; }
    case "backup": backup(); break;
    case "ripristina": document.getElementById("fileRipr").click(); break;
    case "csv": csvMese(); break;
    case "stampa": document.querySelectorAll("details").forEach(d=>d.open=true); setTimeout(()=>window.print(),100); break;
    case "cancellatutto":
      if(confirm("Cancello TUTTI i dati da questo telefono?") && confirm("Sicuro? Senza backup non si recuperano.")){ db = vuoto(); salva(); render(); }
      break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if(el.id==="fileRipr" && el.files[0]){ ripristina(el.files[0]); el.value=""; return; }
  const a = el.dataset.actChange;
  if(a==="sceglidata" && el.value){ stato.giorno = el.value; render(); }
  if(a==="sceglimese" && el.value){ stato.mese = el.value; render(); }
  if(a==="nome"){ db.imp.nome = el.value.trim(); salva(); document.getElementById("chi").textContent = db.imp.nome?`Capogruppo: ${db.imp.nome}`:""; toast("Nome salvato"); }
  // Scegliendo il servizio l'orario tipico si compila da solo
  if(el.id==="tSer"){
    const s = servizio(el.value);
    if(s && s.dalle && s.alle){
      document.getElementById("tDa").value = s.dalle; document.getElementById("tA").value = s.alle;
      const d = !!(s.dalle2&&s.alle2);
      document.getElementById("tDoppio").checked = d; document.getElementById("boxDoppio").style.display = d?"grid":"none";
      document.getElementById("tDa2").value = s.dalle2||""; document.getElementById("tA2").value = s.alle2||"";
    }
  }
  if(el.id==="tDoppio"){ document.getElementById("boxDoppio").style.display = el.checked?"grid":"none"; }
  if(el.id==="rSalta" || el.id==="rDal" || el.id==="rAl") contaRipeti();
  if(el.id==="aSer" || el.id==="aDal" || el.id==="aAl") contaAssegna();
  if(el.closest("#foglio") && document.getElementById("tTot")) aggiornaTotTurno();
});
document.addEventListener("input", e => {
  if(e.target.closest("#foglio") && document.getElementById("tTot")) aggiornaTotTurno();
});

// Funzionamento senza internet (solo quando la pagina e' pubblicata su un sito)
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();

/**
 * Apre il pacchetto dell'ufficio e mostra il riepilogo. Se qualcosa non va lo
 * dice in chiaro, invece di lasciare l'app muta.
 */
async function caricaPacco(pacco){
  try{
    const dati = await apriPacco(pacco);
    if(!dati || !Array.isArray(dati.turni)) throw new Error("il messaggio non contiene turni");
    paccoInAttesa = dati;
    foglioImport(dati);
  }catch(e){
    alert("Non riesco a leggere i turni dell'ufficio.\n\n" + e.message + "\n\nChiedi all'ufficio di rimandare il messaggio.");
  }
}

// Link aperto da WhatsApp: i dati stanno dopo il cancelletto. Si toglie subito
// dall'indirizzo, cosi' ricaricando la pagina non si riapre tutto da capo.
(function(){
  const pacco = trovaPacco(location.hash);
  if(!pacco) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  caricaPacco(pacco);
})();
</script>
