<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01696f">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Ore Squadra</title>
<style>
:root{
  --verde:#01696f; --verde-sc:#014d52; --verde-ch:#e6f2f2;
  --sfondo:#f4f3ef; --carta:#ffffff; --testo:#1f2a2a; --grigio:#6b7676; --bordo:#d9d6cf;
  --giallo:#fff4d6; --giallo-b:#d4a017; --rosso:#b03a48; --rosso-ch:#fbe9eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--sfondo);color:var(--testo);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:700}
header.top .chi{font-size:12px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:12px 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--carta);border-top:1px solid var(--bordo);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--grigio);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--verde);font-weight:700}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:10px;padding:12px;margin-bottom:10px}
.riga{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--grigio);font-size:13px}
.big{font-size:26px;font-weight:800;color:var(--verde);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-weight:700}
button.btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
button.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
button.btn.dan{color:var(--rosso);border-color:#e3b5bb}
button.btn.full{width:100%}
button.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.navdata{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.navdata .freccia{border:1px solid var(--bordo);background:var(--carta);border-radius:8px;width:44px;height:44px;font-size:20px}
.navdata .centro{flex:1;text-align:center;position:relative}
.navdata .centro .t{font-weight:700;font-size:16px}
.navdata .centro input{position:absolute;inset:0;opacity:0;width:100%}
.turno{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.turno .barra{width:5px;align-self:stretch;border-radius:3px;background:var(--verde)}
.turno .op{font-weight:700}
/* Chi ci va: sotto l'orario, in evidenza ma meno del nome del posto */
.turno .chi{font-weight:600;color:var(--verde);margin-top:2px}
/* Giallo: turno arrivato dall'ufficio e ancora senza nome. Sbiadito: annullato */
.turno.daass{background:var(--giallo);border-color:var(--giallo-b)}
.turno.daass .op{color:#6b4e00}
.turno.annull{opacity:.6}
.turno.annull .op,.turno.annull .ore{text-decoration:line-through}
.turno .ore{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--verde);white-space:nowrap}
.avviso{background:var(--rosso-ch);color:var(--rosso);border-radius:6px;padding:4px 8px;font-size:12px;margin-top:6px}
.banner{background:var(--giallo);border:1px solid var(--giallo-b);color:#6b4e00;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center}
.vuoto{text-align:center;color:var(--grigio);padding:24px 8px}
.seg{display:flex;background:#e7e5df;border-radius:9px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--grigio);font-size:14px}
.seg button.on{background:var(--carta);color:var(--verde);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11px;color:var(--grigio);font-weight:700}
.cal .g{background:var(--carta);border:1px solid var(--bordo);border-radius:7px;min-height:52px;padding:4px;font-size:12px;display:flex;flex-direction:column;cursor:pointer}
.cal .g.vuota{visibility:hidden}
.cal .g .n{font-weight:700}
/* Il numero dei clienti del giorno: prima qui c'erano le ore ("91:15"), che
   prendevano tutta la larghezza. "N.7" sta largo, quindi si puo' leggere piu' grande */
.cal .g .o{margin-top:auto;font-weight:800;color:var(--verde);font-size:14px;font-variant-numeric:tabular-nums}
.cal .g.oggi{outline:2px solid var(--verde)}
.cal .g.dom .n{color:var(--rosso)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--grigio);font-weight:700;border-bottom:1px solid var(--bordo);padding:6px 4px}
table.t td{border-bottom:1px solid #eeece6;padding:6px 4px;vertical-align:top}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:800;border-top:2px solid var(--verde);border-bottom:0}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.chev{transition:transform .15s;color:var(--grigio)}
details[open] .chev{transform:rotate(90deg)}
.lista-el{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eeece6;cursor:pointer}
.lista-el:last-child{border-bottom:0}
.pill{font-size:11px;border-radius:20px;padding:2px 8px;background:#e7e5df;color:var(--grigio)}
/* foglio a comparsa */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
#foglio{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--carta);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:none;max-width:640px;margin:0 auto}
#foglio h2{margin:0 0 12px;font-size:18px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--grigio);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bordo);border-radius:8px;background:#fff;color:var(--testo)}
.due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.totbox{background:var(--verde-ch);border:1px solid var(--verde);color:var(--verde);border-radius:8px;padding:10px 12px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.totbox b{font-size:20px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--bordo);background:#fff;border-radius:7px;padding:7px 9px;font-weight:700;font-size:12px;color:var(--grigio)}
.chips button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a2a;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;display:none;max-width:90vw}
.solo-stampa{display:none}
@media print{
  header.top,nav.tabs,.no-stampa,.banner,#toast{display:none!important}
  body{padding:0;background:#fff;font-size:11px}
  main{max-width:none;padding:0}
  .card{border:0;border-bottom:1px solid #999;border-radius:0;break-inside:avoid;padding:6px 0}
  .solo-stampa{display:block}
  details>summary .chev{display:none}
}
</style>

<body>
<header class="top">
  <div><h1>Ore Squadra</h1><div class="chi" id="chi"></div></div>
  <div class="chi" id="totTop"></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-act="vista" data-v="giorno"><span class="ic">📅</span>Giorno</button>
  <button data-act="vista" data-v="mese"><span class="ic">🗓️</span>Mese</button>
  <button data-act="vista" data-v="riepilogo"><span class="ic">📊</span>Riepilogo</button>
  <button data-act="vista" data-v="liste"><span class="ic">👥</span>Liste</button>
  <button data-act="vista" data-v="altro"><span class="ic">⚙️</span>Altro</button>
</nav>
<div id="velo"></div>
<div id="foglio"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   Ore Squadra — app del capogruppo per segnare dove e quanto ha lavorato
   ognuno dei suoi. Funziona solo sul telefono: i dati stanno nel browser
   (localStorage), niente server, niente collegamenti al gestionale.
   Per non perdere nulla c'e' il backup in un file.
   ===================================================================== */
const CHIAVE = "oreSquadra.v1";
const GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const GG = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MM = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const TINTE = ["#01696f","#2a5d9f","#c78219","#8a4f9e","#b03a48","#1d8a5e","#5a6b2f","#a0522d"];

/* ---------- dati ---------- */
function vuoto(){ return { versione:1, risorse:[], servizi:[], turni:[], imp:{ nome:"" } }; }
function carica(){
  try{
    const s = localStorage.getItem(CHIAVE);
    if(!s) return vuoto();
    const d = JSON.parse(s);
    const v = vuoto();
    return { ...v, ...d, imp:{ ...v.imp, ...(d.imp||{}) } };
  }catch(e){ return vuoto(); }
}
let db = carica();
function salva(){
  try{ localStorage.setItem(CHIAVE, JSON.stringify(db)); }
  catch(e){ alert("Attenzione: non riesco a salvare sul telefono ("+e.message+"). Fai subito un backup da Altro."); }
}
// Chiede al browser di non cancellare i dati quando il telefono e' pieno
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ---------- utilita' ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daIso = s => new Date(s+"T00:00:00");
const oggi = () => iso(new Date());
const spostaGiorno = (s,n) => { const d=daIso(s); d.setDate(d.getDate()+n); return iso(d); };
const spostaMese = (m,n) => { const [a,b]=m.split("-").map(Number); const d=new Date(a,b-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const nomeMese = m => { const [a,b]=m.split("-").map(Number); return `${MESI[b-1]} ${a}`; };
const dataLunga = s => { const d=daIso(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const dataBreve = s => { const d=daIso(s); return `${GG[d.getDay()]} ${d.getDate()} ${MM[d.getMonth()]}`; };
const aMin = t => { const [h,m]=(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); };
// Durata in minuti; se l'orario passa la mezzanotte (22:00-06:00) arriva al mattino dopo
const durata = (a,b) => { if(!a||!b) return 0; let m=aMin(b)-aMin(a); if(m<0) m+=1440; return m; };
const minParte = (a,b,a2,b2) => durata(a,b) + ((a2&&b2) ? durata(a2,b2) : 0);
const hm = m => `${Math.floor(m/60)}:${pad(Math.round(m%60))}`;
const decimali = m => (Math.round(m/60*100)/100).toString().replace(".",",");
const risorsa = id => db.risorse.find(r=>r.id===id);
const servizio = id => db.servizi.find(s=>s.id===id);
// Un turno senza operatore e' un turno arrivato dall'ufficio e non ancora
// assegnato: non e' un errore, e' lavoro da smistare
const nomeR = id => !id ? "Da assegnare" : (risorsa(id)?.nome || "(operatore eliminato)");
const nomeS = id => servizio(id)?.nome || "(servizio eliminato)";
/** Nome e indirizzo insieme: serve dove due negozi della stessa catena
 *  si chiamano uguale e bisogna capire di quale si parla. */
const dove = id => { const s = servizio(id); return s?.indirizzo ? `${s.nome} · ${s.indirizzo}` : nomeS(id); };
const coloreS = id => { const i=db.servizi.findIndex(s=>s.id===id); return TINTE[(i<0?0:i)%TINTE.length]; };
const orario = t => `${t.dalle}–${t.alle}` + (t.dalle2&&t.alle2 ? ` + ${t.dalle2}–${t.alle2}` : "");
const orarioB = t => `${t.bDalle}–${t.bAlle}` + (t.bDalle2&&t.bAlle2 ? ` + ${t.bDalle2}–${t.bAlle2}` : "");

/**
 * Chi lavora in questo turno, e per quante ore ciascuno.
 *
 * L'ufficio manda una riga sola: il posto e le ore da coprire. Il capogruppo
 * ci mette i nomi, e quelle ore se le possono dividere in due persone — o
 * farle insieme. Da qui passano TUTTI i conti (giornata, mese, riepiloghi,
 * Excel): cosi' le ore del secondo non spariscono da nessuna parte.
 */
function parti(t){
  const out = [{ risorsaId:t.risorsaId||"", min:minParte(t.dalle,t.alle,t.dalle2,t.alle2), orario:orario(t) }];
  if(t.risorsaB || t.bDalle) out.push({ risorsaId:t.risorsaB||"", min:minParte(t.bDalle,t.bAlle,t.bDalle2,t.bAlle2), orario:orarioB(t), secondo:true });
  return out;
}
const minTurno = t => parti(t).reduce((s,p)=>s+p.min,0);
/** Le ore che l'ufficio ha dato per questo turno: e' il tetto da non passare */
const minUfficio = t => t.prev ? minParte(t.prev.dalle,t.prev.alle,t.prev.dalle2,t.prev.alle2) : 0;
const turniDel = g => db.turni.filter(t=>t.data===g).sort((a,b)=>nomeR(a.risorsaId).localeCompare(nomeR(b.risorsaId))||a.dalle.localeCompare(b.dalle));
const turniMese = m => db.turni.filter(t=>t.data.startsWith(m)).sort((a,b)=>a.data.localeCompare(b.data)||a.dalle.localeCompare(b.dalle));
const attive = arr => arr.filter(x=>!x.nascosto).sort((a,b)=>a.nome.localeCompare(b.nome));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",2600); }

/*
 * Qui stavano due controlli: la stessa persona in due posti alla stessa ora,
 * e il tetto delle dodici ore in un giorno. Tolti tutti e due per scelta
 * dell'ufficio.
 *
 * Il motivo: il lavoro della squadra e' intestato tutto al capogruppo, quindi
 * in un giorno risultano dieci turni suoi in dieci posti diversi, e va bene
 * cosi' — il monte ore che gli si riconosce e' quello che si paga. Un avviso
 * che suona su ogni riga non e' un avviso, e' rumore.
 *
 * Restano le segnalazioni che arrivano dall'ufficio: "cambiato" e "annullato".
 * Quelle non sono giudizi dell'app, sono notizie, e si vedono ancora.
 */

/* =====================================================================
   TURNI DALL'UFFICIO
   L'ufficio manda su WhatsApp un link: i dati stanno dopo il cancelletto,
   quindi non passano da nessun server, restano nel telefono.
   Ogni turno porta l'id del gestionale (gid): e' quello che permette di
   rimandare lo stesso elenco dopo una correzione senza perdere il lavoro
   gia' fatto qui.

   Di ogni turno si tengono DUE orari:
     prev   = quello previsto dall'ufficio
     dalle/alle = quello svolto davvero, che il capogruppo puo' correggere
   Se l'ufficio cambia il previsto e lui non aveva toccato niente, si
   aggiornano tutti e due. Se invece lui aveva gia' corretto lo svolto,
   quello resta: e' la sua parola sul campo.
   ===================================================================== */

/** Da base64url ai byte */
function daBase64url(s){
  const b64 = s.replace(/-/g,"+").replace(/_/g,"/") + "=".repeat((4 - s.length % 4) % 4);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** Apre il pacchetto: "g" = compresso, "j" = testo semplice */
async function apriPacco(pacco){
  const tipo = pacco[0], corpo = daBase64url(pacco.slice(1));
  if(tipo === "j") return JSON.parse(new TextDecoder().decode(corpo));
  if(tipo !== "g") throw new Error("formato sconosciuto");
  if(!window.DecompressionStream) throw new Error("questo telefono non sa aprire i dati compressi: chiedi all'ufficio il messaggio non compresso");
  const flusso = new Blob([corpo]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(flusso).text());
}

/** Pesca il pacchetto da un link o da un messaggio incollato */
function trovaPacco(testo){
  const m = String(testo||"").match(/#imp=([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}

/**
 * Un turno sta dentro quello che l'ufficio ha mandato?
 * I pacchetti vecchi non hanno la data finale: allora vale "dal giorno X in
 * poi", come prima.
 */
const nelPeriodo = (t, dati) =>
  !!t.gid && t.data >= dati.dal && (!dati.al || t.data <= dati.al);

/**
 * Quello che l'ufficio dice di un turno: orari, nota e postazione.
 * Si tiene da parte per capire, alla spedizione dopo, cosa ha cambiato
 * l'ufficio e cosa invece ha corretto il capogruppo.
 */
const previstoDa = (n, servizioId) => ({
  dalle:n.a, alle:n.b, dalle2:n.a2||"", alle2:n.b2||"", note:n.note||"", p:servizioId||"",
});

const stessoOrario = (a,b) =>
  (a?.dalle||"")===(b?.dalle||"") && (a?.alle||"")===(b?.alle||"") &&
  (a?.dalle2||"")===(b?.dalle2||"") && (a?.alle2||"")===(b?.alle2||"");

/** L'ufficio ha cambiato qualcosa? Orari, nota o postazione. */
const stessoPrevisto = (a,b) =>
  stessoOrario(a,b) && (a?.note||"")===(b?.note||"") && (a?.p||"")===(b?.p||"");

/**
 * Guarda cosa cambierebbe, senza cambiare niente: serve a mostrare il
 * riepilogo prima di importare.
 */
function confrontaImport(dati){
  const perGid = {}; for(const t of db.turni) if(t.gid) perGid[t.gid] = t;
  const arrivati = new Set((dati.turni||[]).map(t=>t.g));
  let nuovi=0, modificati=0, invariati=0;
  for(const n of dati.turni||[]){
    const v = perGid[n.g];
    if(!v){ nuovi++; continue; }
    // Qui la postazione non si confronta: servirebbe rifare tutta la mappa
    // delle postazioni, e il conteggio e' solo un'anteprima
    const prev = previstoDa(n, v.servizioId);
    if(stessoPrevisto(v.prev, prev) && v.data===n.d && !v.statoUff) invariati++; else modificati++;
  }
  // Spariti. In un messaggio COMPLETO si capisce dal silenzio: c'erano, stanno
  // nel periodo mandato, e stavolta non arrivano. In uno PARZIALE il silenzio
  // vuol dire "non e' cambiato", quindi le cancellazioni l'ufficio le dice per
  // nome nella lista `rimossi`.
  const annullati = dati.parziale
    ? db.turni.filter(t => t.gid && (dati.rimossi||[]).includes(t.gid) && t.statoUff !== "annullato").length
    : db.turni.filter(t => nelPeriodo(t, dati) && !arrivati.has(t.gid) && t.statoUff !== "annullato").length;
  return { nuovi, modificati, invariati, annullati };
}

/** Applica davvero. Torna il riepilogo di quello che ha fatto. */
function applicaImport(dati){
  const esito = { nuovi:0, modificati:0, invariati:0, annullati:0, risorse:0, servizi:0 };

  const uguale = (a,b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();

  // ── Le persone della squadra ──────────────────────────────────────────
  // Si cerca prima per id del gestionale. Il nome e' solo un ripiego, per
  // agganciare chi il capogruppo aveva gia' scritto a mano, e vale una volta
  // sola: due persone con lo stesso nome non devono diventare una.
  const perOp = {}, risUsate = new Set();
  for(const o of dati.squadra||[]){
    let r = db.risorse.find(x=>x.gid===o.id)
         || db.risorse.find(x=>!x.gid && !risUsate.has(x.id) && uguale(x.nome,o.n));
    if(!r){ r = { id:uid(), nome:o.n, tel:"", nascosto:false, gid:o.id }; db.risorse.push(r); esito.risorse++; }
    if(!r.gid) r.gid = o.id;
    risUsate.add(r.id);
    perOp[o.id] = r.id;
  }

  // ── Le postazioni ─────────────────────────────────────────────────────
  // Stessa regola, e qui conta davvero: della stessa catena arrivano piu'
  // negozi con lo stesso nome e indirizzi diversi. Se si agganciassero per
  // nome diventerebbero un negozio solo e le ore finirebbero tutte li'.
  const perPost = {}, serUsati = new Set();
  for(const p of dati.postazioni||[]){
    let s = (p.k ? db.servizi.find(x=>x.gid===p.k) : null)
         || db.servizi.find(x=>!x.gid && !serUsati.has(x.id) && uguale(x.nome,p.n) && (!x.indirizzo || !p.i || uguale(x.indirizzo,p.i)));
    if(!s){
      // Il nome resta quello del cliente, anche se un altro negozio si chiama
      // uguale: a distinguerli ci pensa l'indirizzo, che si mostra sempre
      // accanto al nome. Attaccarlo dentro al nome faceva due righe diverse —
      // "ACTION" e "ACTION · Via Lorenteggio" — per due cose dello stesso tipo.
      s = { id:uid(), nome:p.n, indirizzo:p.i||"", dalle:"", alle:"", dalle2:"", alle2:"", orePreviste:"", nascosto:false, gid:p.k||null };
      db.servizi.push(s); esito.servizi++;
    }
    if(!s.gid && p.k) s.gid = p.k;
    if(!s.indirizzo && p.i) s.indirizzo = p.i;
    // Postazioni create dalla versione di prima, con l'indirizzo dentro al
    // nome: si rimette a posto il nome, l'indirizzo e' gia' nel suo campo
    if(p.i && s.nome === `${p.n} · ${p.i}`) s.nome = p.n;
    serUsati.add(s.id);
    perPost[p.p] = s.id;
  }

  // ── I turni ───────────────────────────────────────────────────────────
  const perGid = {}; for(const t of db.turni) if(t.gid) perGid[t.gid] = t;
  const arrivati = new Set();

  for(const n of dati.turni||[]){
    arrivati.add(n.g);
    const prev = previstoDa(n, perPost[n.p]);
    const v = perGid[n.g];

    if(!v){
      // Il turno arriva gia' intestato a chi lo ha nel gestionale — di norma
      // il capogruppo stesso, perche' e' a lui che l'ufficio assegna tutto il
      // lavoro della squadra. Poi lui apre il turno e ci mette il nome di chi
      // l'ha fatto davvero.
      db.turni.push({
        id:uid(), gid:n.g, data:n.d, servizioId:perPost[n.p]||"",
        risorsaId: (n.o && perOp[n.o]) || "",
        dalle:prev.dalle, alle:prev.alle, dalle2:prev.dalle2, alle2:prev.alle2,
        note:n.note||"", prev, statoUff:"",
        // "uff" = il nome e' ancora quello dell'ufficio, il capogruppo non
        // l'ha ancora smistato. Non si vede a schermo: e' la traccia di
        // cosa ha gia' guardato, se un domani serve.
        uff: 1,
      });
      esito.nuovi++;
      continue;
    }

    // Turni entrati prima che esistesse il segno "uff": se hanno ancora in
    // faccia il nome che manda l'ufficio, vuol dire che non li ha smistati lui.
    if(v.uff === undefined && n.o && v.risorsaId === perOp[n.o]) v.uff = 1;

    /*
     * IL NOME NON SI TOCCA MAI.
     *
     * Su un turno che c'e' gia', `risorsaId` resta quello che ha messo lui,
     * qualunque cosa dica l'ufficio: al capogruppo serve contare le ore dei
     * suoi ragazzi, e quel nome e' la sua parola su chi ha lavorato. L'ufficio
     * intesta tutto a lui, quindi il nome che manda non saprebbe comunque chi
     * c'era davvero. Vale anche se nel gestionale il turno viene spostato su
     * un altro operatore: qui cambiano il giorno, gli orari, la postazione e
     * la nota — mai la persona.
     */
    // Cambiato dall'ufficio: orari, giorno, nota o postazione
    const cambiato = !stessoPrevisto(v.prev, prev) || v.data !== n.d;
    // Lo svolto lo si tocca solo se lui non l'aveva gia' corretto
    const orariNonToccati = !v.prev || stessoOrario(v, v.prev);
    const notaNonToccata = !v.prev || (v.note||"") === (v.prev.note||"");
    v.data = n.d;
    v.servizioId = perPost[n.p] || v.servizioId;
    if(notaNonToccata) v.note = prev.note;
    if(orariNonToccati){ v.dalle=prev.dalle; v.alle=prev.alle; v.dalle2=prev.dalle2; v.alle2=prev.alle2; }
    v.prev = prev;
    v.statoUff = cambiato ? "modificato" : "";
    if(cambiato) esito.modificati++; else esito.invariati++;
  }

  // ── Quelli spariti: non si cancellano da soli, li conferma lui ────────
  // Messaggio parziale: le cancellazioni arrivano scritte per nome.
  // Messaggio completo: si deducono dal silenzio, ma solo dentro il periodo
  // mandato — quello che sta fuori non e' stato annullato, semplicemente
  // l'ufficio stavolta non lo ha mandato.
  const spariti = dati.parziale
    ? db.turni.filter(t => t.gid && (dati.rimossi||[]).includes(t.gid))
    : db.turni.filter(t => nelPeriodo(t, dati) && !arrivati.has(t.gid));
  for(const t of spariti){
    if(t.statoUff !== "annullato"){ t.statoUff = "annullato"; esito.annullati++; }
  }

  if(!db.imp.nome && dati.capo) db.imp.nome = dati.capo;
  // Chi e' il capogruppo fra le risorse, cosi' si sa qual e' il suo nome
  if(dati.capoId && perOp[dati.capoId]) db.imp.capoRisorsa = perOp[dati.capoId];
  db.imp.ultimoImport = { quando:new Date().toISOString(), dal:dati.dal, turni:(dati.turni||[]).length };
  salva();
  return esito;
}

/*
 * Qui stava "Assegna in blocco", che spostava tanti turni da una persona a
 * un'altra in un colpo solo. Tolto per scelta dell'ufficio: lui lavora giorno
 * per giorno, tocca il turno e ci mette il nome di chi l'ha fatto davvero.
 */

/* ---------- stato della schermata ---------- */
const stato = { vista:"giorno", giorno:oggi(), mese:oggi().slice(0,7), riep:"op", liste:"risorse" };

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===stato.vista));
  document.getElementById("chi").textContent = db.imp.nome ? `Capogruppo: ${db.imp.nome}` : "Tocca Altro per mettere il tuo nome";
  const m = document.getElementById("main");
  m.innerHTML = VISTE[stato.vista]();
  window.scrollTo(0,0);
}

/*
 * Qui stava l'avviso "fai un backup". Tolto con il backup stesso, per scelta
 * dell'ufficio: i turni arrivano dal gestionale e si riprendono da li' quante
 * volte serve. Resta fuori solo quello che fa lui sopra ai turni — chi ha
 * lavorato e gli orari che corregge — e quello vive su questo telefono.
 */

/* ---------- vista GIORNO ---------- */
function vistaGiorno(){
  if(!db.turni.length){
    return `<div class="card vuoto"><div style="font-size:34px">👋</div>
      <p><b>Benvenuto!</b><br>I turni arrivano dall'ufficio e compaiono qui da soli.<br>
      Se non vedi niente, vai in <b>Altro</b> e tocca «Controlla adesso».</p>
      <button class="btn pri" data-act="vista" data-v="altro">Vai in Altro</button></div>`;
  }
  const g = stato.giorno, lista = turniDel(g);
  const tot = lista.reduce((s,t)=>s+minTurno(t),0);
  let h = `<div class="navdata">
    <button class="freccia" data-act="giorno" data-n="-1">‹</button>
    <div class="centro"><div class="t">${esc(dataLunga(g))}</div><div class="muted">${g===oggi()?"oggi":"tocca per scegliere il giorno"}</div>
      <input type="date" value="${g}" data-act-change="sceglidata"></div>
    <button class="freccia" data-act="giorno" data-n="1">›</button></div>
    <div class="card riga"><div><div class="muted">Totale ore del giorno</div><div class="big">${hm(tot)}</div></div><div class="sp"></div>
      <div class="muted" style="text-align:right">${lista.length} turn${lista.length===1?"o":"i"}<br>${(()=>{
        // I turni senza nome non sono "una persona": si contano a parte
        const p = new Set(lista.flatMap(t=>parti(t)).map(x=>x.risorsaId).filter(Boolean)).size;
        const d = lista.filter(t=>!t.risorsaId).length;
        return [p?`${p} person${p===1?"a":"e"}`:"", d?`${d} da assegnare`:""].filter(Boolean).join("<br>") || "—";
      })()}</div></div>`;
  if(!lista.length) h += `<div class="card vuoto">Nessun turno in questo giorno.</div>`;
  for(const t of lista){
    const daAssegnare = !t.risorsaId;
    const annullato = t.statoUff === "annullato";
    // L'ordine e' quello con cui si legge un turno: DOVE si va, in che via,
    // a che ora, e solo alla fine CHI ci va. Il posto e' la cosa che
    // identifica il turno; il nome cambia spesso, il negozio no.
    h += `<div class="card turno ${daAssegnare?"daass":""} ${annullato?"annull":""}" data-act="modifica" data-id="${t.id}">
      <div class="barra" style="background:${coloreS(t.servizioId)}"></div>
      <div class="sp"><div class="op">${esc(nomeS(t.servizioId))}</div>
        ${servizio(t.servizioId)?.indirizzo ? `<div class="muted">${esc(servizio(t.servizioId).indirizzo)}</div>` : ""}
        ${parti(t).map(p=>`<div>${esc(p.orario)}</div><div class="chi">${esc(nomeR(p.risorsaId))}</div>`).join("")}
        ${t.risorsaB?`<div class="muted">${t.insieme?"Insieme":"Si dividono il turno"}</div>`:""}
        ${t.note?`<div class="muted">${esc(t.note)}</div>`:""}
        ${annullato ? `<div class="avviso">✕ Annullato dall'ufficio — aprilo e togli il turno</div>` : ""}</div>
      <div class="ore">${hm(minTurno(t))}</div></div>`;
  }
  /*
   * Qui stavano "Aggiungi turno", "Assegna in blocco", "Copia da ieri" e
   * "Ripeti su più giorni". Tolti per scelta dell'ufficio: i turni arrivano
   * dal gestionale e si aggiornano da soli, quindi crearne o duplicarne a
   * mano qui dentro vorrebbe dire scrivere righe che l'ufficio non conosce.
   * Lui lavora giorno per giorno: tocca il turno e lo sistema.
   */
  return h;
}

/* ---------- vista MESE ---------- */
function vistaMese(){
  const m = stato.mese, [a,b] = m.split("-").map(Number);
  const primo = new Date(a,b-1,1), nGiorni = new Date(a,b,0).getDate();
  const lista = turniMese(m);
  const perGiorno = {}; for(const t of lista) perGiorno[t.data]=(perGiorno[t.data]||0)+minTurno(t);
  // Nel calendario non vanno le ore ma QUANTI CLIENTI ci sono quel giorno:
  // e' il numero che dice al capogruppo quanti posti deve coprire. Le ore
  // restano, in grande, toccando il giorno.
  const clientiGiorno = {};
  for(const t of lista) (clientiGiorno[t.data] ||= new Set()).add(t.servizioId);
  const tot = lista.reduce((s,t)=>s+minTurno(t),0);
  let h = navMese() + `<div class="card riga"><div><div class="muted">Totale ore del mese</div><div class="big">${hm(tot)}</div></div><div class="sp"></div>
    <div class="muted" style="text-align:right">${lista.length} turni<br>${Object.keys(perGiorno).length} giorni lavorati</div></div>
    <div class="cal">${["L","M","M","G","V","S","D"].map(x=>`<div class="h">${x}</div>`).join("")}`;
  for(let i=0;i<(primo.getDay()+6)%7;i++) h+=`<div class="g vuota"></div>`;
  for(let d=1; d<=nGiorni; d++){
    const g = `${m}-${pad(d)}`, dt=daIso(g);
    const nCli = clientiGiorno[g]?.size || 0;
    h += `<div class="g ${g===oggi()?"oggi":""} ${dt.getDay()===0?"dom":""}" data-act="apri" data-g="${g}"`
      + ` title="${nCli?`${nCli} client${nCli===1?"e":"i"} · ${hm(perGiorno[g])} ore`:"niente"}">`
      + `<span class="n">${d}</span>${nCli?`<span class="o">N.${nCli}</span>`:""}</div>`;
  }
  return h + `</div><p class="muted" style="text-align:center"><b>N.</b> è quanti clienti ci sono quel giorno. Tocca un giorno per vedere i turni e le ore.</p>`;
}
function navMese(){
  return `<div class="navdata no-stampa"><button class="freccia" data-act="mese" data-n="-1">‹</button>
    <div class="centro"><div class="t" style="text-transform:capitalize">${nomeMese(stato.mese)}</div>
    <input type="month" value="${stato.mese}" data-act-change="sceglimese"></div>
    <button class="freccia" data-act="mese" data-n="1">›</button></div>`;
}

/* ---------- vista RIEPILOGO ---------- */
function vistaRiepilogo(){
  const m = stato.mese, lista = turniMese(m);
  let h = navMese() + `<div class="seg no-stampa"><button class="${stato.riep==="op"?"on":""}" data-act="riep" data-v="op">Per operatore</button><button class="${stato.riep==="serv"?"on":""}" data-act="riep" data-v="serv">Per servizio</button></div>
    <div class="solo-stampa"><h2 style="margin:0">Ore ${stato.riep==="op"?"per operatore":"per servizio"} — <span style="text-transform:capitalize">${nomeMese(m)}</span></h2><p>${esc(db.imp.nome?("Capogruppo: "+db.imp.nome):"")}</p></div>`;
  if(!lista.length) return h + `<div class="card vuoto">Nessun turno in ${nomeMese(m)}.</div>`;
  h += stato.riep==="op" ? riepOperatori(lista) : riepServizi(lista);
  h += `<div class="btns no-stampa" style="margin-top:6px"><button class="btn" data-act="csv">📄 Excel del mese</button><button class="btn" data-act="stampa">🖨️ Stampa / PDF</button></div>`;
  return h;
}
/**
 * Le ore di ciascuno nel mese.
 *
 * Si ragiona per PARTI, non per turni: in un turno possono esserci due
 * persone, e le ore di ognuna devono finire sotto il suo nome. E' il conto
 * che serve al capogruppo per pagare i suoi.
 */
function riepOperatori(lista){
  const per = {};
  for(const t of lista) for(const p of parti(t)){ if(p.min || p.risorsaId) (per[p.risorsaId] ||= []).push({ t, p }); }
  const ids = Object.keys(per).sort((a,b)=>nomeR(a).localeCompare(nomeR(b)));
  let h = "";
  for(const id of ids){
    const ts = per[id], tot = ts.reduce((s,x)=>s+x.p.min,0);
    const giorni = {}; for(const x of ts) (giorni[x.t.data] ||= []).push(x);
    let righe = "";
    for(const g of Object.keys(giorni).sort()){
      const gt = giorni[g], totG = gt.reduce((s,x)=>s+x.p.min,0);
      gt.forEach((x,i)=>{
        const t = x.t;
        righe += `<tr>${i===0?`<td rowspan="${gt.length}">${esc(dataBreve(g))}</td>`:""}
          <td>${esc(nomeS(t.servizioId))}${servizio(t.servizioId)?.indirizzo?`<div class="muted">${esc(servizio(t.servizioId).indirizzo)}</div>`:""}</td>
          <td class="r">${esc(x.p.orario).replace(" + ","<br>")}</td>
          ${i===0?`<td class="r num" rowspan="${gt.length}">${hm(totG)}</td>`:""}</tr>`;
      });
    }
    h += `<details class="card"><summary class="riga"><span class="chev">▶</span><div class="sp"><div class="op" style="font-weight:700">${esc(nomeR(id))}</div>
        <div class="muted">${Object.keys(giorni).length} giorni · ${ts.length} turni</div></div><div class="big" style="font-size:22px">${hm(tot)}</div></summary>
      <table class="t" style="margin-top:8px"><tr><th>Giorno</th><th>Dove</th><th class="r">Orario</th><th class="r">Tot giorno</th></tr>${righe}
      <tr class="tot"><td colspan="3">Totale mese</td><td class="r">${hm(tot)}</td></tr></table></details>`;
  }
  const totale = lista.reduce((s,t)=>s+minTurno(t),0);
  return h + `<div class="card riga"><b class="sp">Totale squadra</b><span class="big" style="font-size:22px">${hm(totale)}</span></div>`;
}
function riepServizi(lista){
  const per = {};
  for(const t of lista){ (per[t.servizioId] ||= []).push(t); }
  const ids = Object.keys(per).sort((a,b)=>nomeS(a).localeCompare(nomeS(b)));
  let h = "";
  for(const id of ids){
    const ts = per[id], tot = ts.reduce((s,t)=>s+minTurno(t),0), s = servizio(id);
    const perOp = {}; for(const t of ts) for(const p of parti(t)){ if(p.min||p.risorsaId) perOp[p.risorsaId]=(perOp[p.risorsaId]||0)+p.min; }
    let prev = "";
    if(s && s.orePreviste){
      const diff = tot - s.orePreviste*60;
      const col = Math.abs(diff)<1 ? "#1d8a5e" : (diff<0 ? "#c78219" : "#b03a48");
      prev = `<div style="color:${col};font-size:13px;font-weight:700">Previste ${hm(s.orePreviste*60)} · ${Math.abs(diff)<1?"✓ in linea":(diff<0?`mancano ${hm(-diff)}`:`in più ${hm(diff)}`)}</div>`;
    }
    h += `<details class="card"><summary class="riga"><span class="chev">▶</span><span style="width:10px;height:10px;border-radius:50%;background:${coloreS(id)}"></span>
        <div class="sp"><div style="font-weight:700">${esc(nomeS(id))}</div>${s?.indirizzo?`<div class="muted">${esc(s.indirizzo)}</div>`:""}${prev}</div>
        <div class="big" style="font-size:22px">${hm(tot)}</div></summary>
      <table class="t" style="margin-top:8px"><tr><th>Operatore</th><th class="r">Ore</th></tr>
      ${Object.keys(perOp).sort((a,b)=>nomeR(a).localeCompare(nomeR(b))).map(o=>`<tr><td>${esc(nomeR(o))}</td><td class="r num">${hm(perOp[o])}</td></tr>`).join("")}
      <tr class="tot"><td>Totale</td><td class="r">${hm(tot)}</td></tr></table></details>`;
  }
  return h;
}

/* ---------- vista LISTE ---------- */
/*
 * Solo le persone. I posti dove si lavora stavano qui accanto, in una seconda
 * linguetta: tolti, perche' li decide l'ufficio e arrivano con i turni.
 */
function vistaListe(){
  const arr = db.risorse.slice().sort((a,b)=>(!!a.nascosto-!!b.nascosto)||a.nome.localeCompare(b.nome));

    <button class="btn pri full" data-act="nuovaR" style="margin-bottom:10px">+ Aggiungi persona</button><div class="card">`;
  if(!arr.length) h += `<div class="vuoto">Ancora nessuna persona.</div>`;
  for(const x of arr){
    // I turni dove compare, come primo o come secondo operatore
    const n = db.turni.filter(t=>t.risorsaId===x.id||t.risorsaB===x.id).length;

      <div class="sp"><div style="font-weight:700">${esc(x.nome)}</div><div class="muted">${esc(x.tel||"")}</div></div>
      ${x.nascosto?`<span class="pill">nascosta</span>`:""}<span class="muted">${n} turni</span></div>`;
  }
  return h + `</div>`;
}

/* ---------- vista ALTRO ---------- */
function vistaAltro(){
  return `<div class="card"><label class="f" style="margin-top:0">Il tuo nome (compare su stampe ed Excel)</label>
      <input class="i" id="nomeCapo" value="${esc(db.imp.nome)}" placeholder="Es. Ibrahim ..." data-act-change="nome"></div>
    ${cardAggiornamento()}
    <div class="card"><b>📨 Turni dall'ufficio</b><p class="muted" style="margin:4px 0 10px">

      <textarea class="i" id="incolla" rows="3" placeholder="Incolla qui tutto il messaggio" style="font-family:monospace;font-size:12px"></textarea>
      <button class="btn full" data-act="leggiIncollato" style="margin-top:8px">Leggi il messaggio</button></div>
    <div class="card"><b>📄 Esporta il mese</b><p class="muted" style="margin:4px 0 10px">File Excel (CSV) con una riga per turno: data, operatore, servizio, orari, ore. Il mese è quello scelto in Mese/Riepilogo: <b style="text-transform:capitalize">${nomeMese(stato.mese)}</b>.</p>
      <button class="btn full" data-act="csv">Esporta ${nomeMese(stato.mese)}</button></div>
    <div class="card"><b>Dati sul telefono</b><p class="muted" style="margin:4px 0 10px">${db.risorse.length} risorse · ${db.servizi.length} servizi · ${db.turni.length} turni</p>

/**
 * Lo stato dell'aggiornamento automatico.
 *
 * Deve rispondere a una domanda sola: "quello che vedo e' aggiornato?".
 * Per questo c'e' sempre scritto QUANDO, anche quando e' andato tutto bene:
 * senza quella riga uno non sa se sta guardando i turni di oggi o di lunedi'.
 */
function cardAggiornamento(){
  if(!db.imp.codice){
    return `<div class="card"><b>🔄 Aggiornamento automatico</b>
      <p class="muted" style="margin:4px 0 0">Non ancora attivo. Quando l'ufficio ti manda il <b>link</b>, aprilo una volta: da li' in poi i turni arrivano da soli, senza altri messaggi.</p></div>`;
  }
  const q = db.imp.quandoAgg ? new Date(db.imp.quandoAgg) : null;
  const min = q ? Math.floor((Date.now()-q.getTime())/60000) : null;
  const fa = min===null ? "mai" : min<2 ? "adesso" : min<60 ? `${min} minuti fa`
    : min<1440 ? `${Math.floor(min/60)} ore fa` : `${Math.floor(min/1440)} giorni fa`;
  const e = db.imp.esitoAgg;
  return `<div class="card"><b>🔄 Aggiornamento automatico</b>
    <p class="muted" style="margin:4px 0 10px">
      Ultimo controllo: <b>${fa}</b>${q?` (${q.toLocaleString("it-IT")})`:""}<br>
      ${!db.imp.parola ? `<span style="color:#b03a48">Manca la parola d'ordine: chiedila all'ufficio.</span><br>` : ""}
      ${e ? `Ultima volta che è cambiato qualcosa: ${e.nuovi} nuovi · ${e.modificati} cambiati · ${e.annullati} annullati<br>` : ""}
      I turni arrivano da soli quando apri l'app. Non serve nessun messaggio dall'ufficio.</p>
    <div class="btns"><button class="btn pri" data-act="aggiornaOra">Controlla adesso</button><button class="btn" data-act="cambiaParola">Parola d'ordine</button></div></div>`;
}

const VISTE = { giorno:vistaGiorno, mese:vistaMese, riepilogo:vistaRiepilogo, liste:vistaListe, altro:vistaAltro };

/* ---------- foglio a comparsa ---------- */
function apriFoglio(html){ const f=document.getElementById("foglio"); f.innerHTML=html; f.style.display="block"; document.getElementById("velo").style.display="block"; f.scrollTop=0; }
function chiudiFoglio(){ document.getElementById("foglio").style.display="none"; document.getElementById("velo").style.display="none"; }
document.getElementById("velo").onclick = chiudiFoglio;
const val = id => (document.getElementById(id)?.value ?? "").trim();

/**
 * La scheda del turno.
 *
 * Il turno lo decide l'ufficio: giorno e posto sono scritti, non si toccano.
 * Quello che mette il capogruppo e' CHI ci va e a che ora — da solo, o in due
 * dividendosi le ore, o in due insieme.
 *
 * In fondo c'e' il conto che gli serve davvero: le ore dei suoi contro le ore
 * che l'ufficio gli riconosce. Quelle non si possono passare, perche' il monte
 * ore e' quello che si paga.
 */
function foglioTurno(t){
  if(!t) return;
  const elenco = (sel) => {
    const ris = attive(db.risorse);
    // Una persona nascosta che pero' e' gia' su questo turno deve restare
    if(sel && !ris.find(r=>r.id===sel) && risorsa(sel)) ris.push(risorsa(sel));
    return ris.map(r=>`<option value="${r.id}" ${r.id===sel?"selected":""}>${esc(r.nome)}</option>`).join("");
  };
  const doppio = !!(t.dalle2||t.alle2);
  const inDue = !!(t.risorsaB || t.bDalle);
  const doppioB = !!(t.bDalle2||t.bAlle2);
  const s = servizio(t.servizioId);

  apriFoglio(`<h2>Turno</h2>
    <div class="totbox" style="margin-top:0"><span>Giorno</span><b>${esc(dataLunga(t.data))}</b></div>
    <div class="card" style="margin:8px 0 0"><div style="font-weight:700">${esc(nomeS(t.servizioId))}</div>
      ${s?.indirizzo?`<div class="muted">${esc(s.indirizzo)}</div>`:""}
      <div class="muted">Giorno e luogo li decide l'ufficio: qui non si cambiano.</div></div>

    <label class="f">Chi va a lavorare</label>
    <select class="i" id="tRis"><option value="">— scegli —</option>${elenco(t.risorsaId)}</select>
    <div class="due"><div><label class="f">Dalle</label><input class="i" type="time" id="tDa" value="${t.dalle||""}"></div><div><label class="f">Alle</label><input class="i" type="time" id="tA" value="${t.alle||""}"></div></div>
    <label class="check"><input type="checkbox" id="tDoppio" ${doppio?"checked":""}> Rientra più tardi (secondo orario)</label>
    <div class="due" id="boxDoppio" style="display:${doppio?"grid":"none"}"><div><label class="f">Dalle 2</label><input class="i" type="time" id="tDa2" value="${t.dalle2||""}"></div><div><label class="f">Alle 2</label><input class="i" type="time" id="tA2" value="${t.alle2||""}"></div></div>

    <label class="check" style="margin-top:10px"><input type="checkbox" id="tInDue" ${inDue?"checked":""}> <b>Sono in due su questo turno</b></label>
    <div id="boxB" style="display:${inDue?"block":"none"}">
      <label class="f">Secondo operatore</label>
      <select class="i" id="tRisB"><option value="">— scegli —</option>${elenco(t.risorsaB)}</select>
      <label class="check"><input type="checkbox" id="tInsieme" ${t.insieme?"checked":""}> Lavorano insieme, stessi orari</label>
      <div class="due"><div><label class="f">Dalle</label><input class="i" type="time" id="tBDa" value="${t.bDalle||""}"></div><div><label class="f">Alle</label><input class="i" type="time" id="tBA" value="${t.bAlle||""}"></div></div>
      <label class="check"><input type="checkbox" id="tBDoppio" ${doppioB?"checked":""}> Rientra più tardi (secondo orario)</label>
      <div class="due" id="boxBDoppio" style="display:${doppioB?"grid":"none"}"><div><label class="f">Dalle 2</label><input class="i" type="time" id="tBDa2" value="${t.bDalle2||""}"></div><div><label class="f">Alle 2</label><input class="i" type="time" id="tBA2" value="${t.bAlle2||""}"></div></div>
    </div>

    <label class="f">Note (facoltative)</label><input class="i" id="tNote" value="${esc(t.note||"")}" placeholder="Es. è entrato più tardi">

    ${t.gid ? `<div class="banner" style="margin:10px 0 0"><span>📨</span><span class="sp">
      ${t.statoUff==="annullato" ? "<b>Annullato dall'ufficio.</b> Se non si è lavorato, lascialo vuoto."
        /* La segnalazione "cambiato dall'ufficio" e' spenta per ora, su
           richiesta: il turno modificato si comporta come gli altri e mostra
           solo l'orario previsto. Il gestionale continua a riconoscere le
           modifiche, quindi per riaccenderla basta rimettere qui il ramo
           t.statoUff === "modificato", e in vistaGiorno il cartellino. */
        : `Turno dell'ufficio · previsto <b>${esc(orario(t.prev||t))}</b> · ${hm(minUfficio(t)||minParte(t.dalle,t.alle,t.dalle2,t.alle2))}`}
    </span></div>` : ""}

    <div class="totbox"><span>Totale giornata</span><b id="tTot">0:00</b></div>
    <div id="tAvviso" style="display:none"></div>

    <div class="btns" style="margin-top:14px"><button class="btn" data-act="chiudi">Annulla</button><button class="btn pri" data-act="salvaT" data-id="${t.id}">Salva</button></div>`);
  foglioTurno.turno = t;
  sincronizzaInsieme();
  aggiornaTotTurno();
}

function leggiTurno(){
  const doppio = document.getElementById("tDoppio").checked;
  const inDue = document.getElementById("tInDue").checked;
  const insieme = inDue && document.getElementById("tInsieme").checked;
  const doppioB = document.getElementById("tBDoppio").checked;
  // "Insieme" vuol dire stessi orari: si ricopiano da soli, cosi' non li
  // riscrive due volte e non puo' sbagliarne uno
  const bDa = insieme ? val("tDa") : val("tBDa");
  const bA  = insieme ? val("tA")  : val("tBA");
  const bDa2 = insieme ? (doppio?val("tDa2"):"") : (doppioB?val("tBDa2"):"");
  const bA2  = insieme ? (doppio?val("tA2"):"")  : (doppioB?val("tBA2"):"");
  return {
    risorsaId:val("tRis"), dalle:val("tDa"), alle:val("tA"),
    dalle2: doppio?val("tDa2"):"", alle2: doppio?val("tA2"):"",
    risorsaB: inDue?val("tRisB"):"", bDalle: inDue?bDa:"", bAlle: inDue?bA:"",
    bDalle2: inDue?bDa2:"", bAlle2: inDue?bA2:"",
    insieme: insieme ? 1 : 0,
    note:val("tNote"),
  };
}

/**
 * "Lavorano insieme": gli orari del secondo diventano quelli del primo e si
 * bloccano. Scriverli due volte uguali e' solo un modo per sbagliarne uno.
 */
function sincronizzaInsieme(){
  const ins = document.getElementById("tInsieme");
  if(!ins) return;
  const campi = [["tBDa","tDa"],["tBA","tA"],["tBDa2","tDa2"],["tBA2","tA2"]];
  for(const [b,a] of campi){
    const eb = document.getElementById(b), ea = document.getElementById(a);
    if(!eb || !ea) continue;
    if(ins.checked){ eb.value = ea.value; eb.readOnly = true; eb.style.opacity = .6; }
    else { eb.readOnly = false; eb.style.opacity = 1; }
  }
  const box = document.getElementById("tBDoppio");
  if(box && ins.checked){
    box.checked = document.getElementById("tDoppio").checked;
    document.getElementById("boxBDoppio").style.display = box.checked?"grid":"none";
  }
}

/** Il conto in fondo alla scheda: quanto fanno i suoi contro quanto da' l'ufficio */
function aggiornaTotTurno(){
  const letto = leggiTurno(), t = foglioTurno.turno || {};
  const fatte = minTurno(letto);
  const uff = minUfficio(t);
  const box = document.getElementById("tTot");
  if(box) box.textContent = hm(fatte);
  const av = document.getElementById("tAvviso");
  if(!av) return;
  /*
   * Finche' sforano, Salva e' spento e gli orari diventano rossi mentre li
   * scrive: lo sbaglio si vede sul campo che lo ha causato, non solo in una
   * riga in fondo alla scheda.
   */
  const salva = document.querySelector('#foglio [data-act="salvaT"]');
  const ORARI = ["tDa","tA","tDa2","tA2","tBDa","tBA","tBDa2","tBA2"];
  const blocca = (si) => {
    if(salva){ salva.disabled = si; salva.style.opacity = si ? .45 : 1; }
    for(const x of ORARI){
      const e = document.getElementById(x);
      if(!e) continue;
      e.style.borderColor = si ? "#b03a48" : "";
      e.style.background = si ? "#fdeaec" : "";
    }
    const tot = document.getElementById("tTot");
    if(tot) tot.style.color = si ? "#b03a48" : "";
  };
  if(!uff){ av.style.display = "none"; blocca(false); return; }
  const diff = fatte - uff;
  av.style.display = "block";
  blocca(diff > 0);
  if(diff > 0){
    av.className = "avviso";
    av.innerHTML = `Sforano di <b>${hm(diff)}</b>: l'ufficio ne dà ${hm(uff)}, qui ce ne sono ${hm(fatte)}. <b>Così non si salva.</b>`;
  } else {
    av.className = "muted";
    av.style.padding = "6px 2px";
    av.innerHTML = diff === 0
      ? `✓ Tornano con le ${hm(uff)} dell'ufficio.`
      : `L'ufficio ne dà ${hm(uff)}: ne restano <b>${hm(-diff)}</b> da coprire.`;
  }
}

/* Risorsa e servizio */
function foglioRisorsa(r){
  const nuovo=!r; r = r || { nome:"", tel:"", nascosto:false };
  apriFoglio(`<h2>${nuovo?"Nuova risorsa":"Modifica risorsa"}</h2>
    <label class="f">Nome e cognome</label><input class="i" id="rNome" value="${esc(r.nome)}" placeholder="Es. Mario Rossi">
    <label class="f">Telefono (facoltativo)</label><input class="i" id="rTel" type="tel" value="${esc(r.tel||"")}">

    <div class="btns" style="margin-top:14px">${nuovo?"":`<button class="btn dan" data-act="eliminaR" data-id="${r.id}">Elimina</button>`}<button class="btn" data-act="chiudi">Annulla</button><button class="btn pri" data-act="salvaR" data-id="${nuovo?"":r.id}">Salva</button></div>`);

/* ---------- file: Excel ---------- */
async function consegnaFile(nome, contenuto, tipo){
  const blob = new Blob([contenuto], { type:tipo });
  // Sul telefono, se si puo', si apre "Condividi" (WhatsApp, mail, Drive...)
  try{
    const file = new File([blob], nome, { type:tipo });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:nome }); return true; }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
/*
 * Qui stavano il salvataggio e il ripristino del backup. Tolti per scelta
 * dell'ufficio: i turni arrivano dal gestionale e si ripubblicano quante volte
 * serve, quindi il telefono non e' piu' l'unica copia di quelli. Resta fuori
 * dal gestionale solo quello che mette lui sopra ai turni — chi ha lavorato e
 * gli orari che corregge — e per portarsi via quello c'e' l'Excel del mese.
 */
function csvMese(){
  const m = stato.mese, lista = turniMese(m);
  if(!lista.length){ toast(`Nessun turno in ${nomeMese(m)}`); return; }
  const c = v => { const s=String(v??""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  // Totale del giorno per persona, ripetuto su ogni riga di quel giorno
  // Una riga per PERSONA: se in un turno sono in due, escono due righe, cosi'
  // le ore di ciascuno si contano per quello che sono
  const righeP = [];
  for(const t of lista) for(const p of parti(t)) if(p.min || p.risorsaId) righeP.push({ t, p });
  const totGiorno = {}; for(const {t,p} of righeP){ const k=p.risorsaId+"|"+t.data; totGiorno[k]=(totGiorno[k]||0)+p.min; }
  const righe = [["Capogruppo","Data","Giorno","Operatore","Servizio","Indirizzo","Dalle","Alle","Dalle 2","Alle 2","Ore turno","Ore turno (decimali)","Tot giorno operatore","In due","Note"]];
  for(const {t,p} of righeP){
    const [da,a] = p.secondo ? [t.bDalle,t.bAlle] : [t.dalle,t.alle];
    const [da2,a2] = p.secondo ? [t.bDalle2||"",t.bAlle2||""] : [t.dalle2||"",t.alle2||""];
    righe.push([db.imp.nome, t.data.split("-").reverse().join("/"), GIORNI[daIso(t.data).getDay()], nomeR(p.risorsaId), nomeS(t.servizioId), servizio(t.servizioId)?.indirizzo||"",
      da, a, da2, a2, hm(p.min), decimali(p.min), hm(totGiorno[p.risorsaId+"|"+t.data]),
      t.risorsaB ? (t.insieme ? "insieme" : "divisi") : "", t.note||""]);
  }
  // Totali del mese per operatore in fondo
  righe.push([]); righe.push(["","","","TOTALI DEL MESE","","","","","","","Ore","Ore (decimali)"]);
  const per={}; for(const {p} of righeP) per[p.risorsaId]=(per[p.risorsaId]||0)+p.min;
  Object.keys(per).sort((a,b)=>nomeR(a).localeCompare(nomeR(b))).forEach(id=>righe.push(["","","",nomeR(id),"","","","","","",hm(per[id]),decimali(per[id])]));
  const testo = "﻿" + righe.map(r=>r.map(c).join(";")).join("\r\n");
  consegnaFile(`ore-squadra-${m}${db.imp.nome?"-"+db.imp.nome.replace(/[^\w]+/g,"_"):""}.csv`, testo, "text/csv");
}

/* ---------- azioni ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case "vista": stato.vista = el.dataset.v; if(stato.vista==="giorno"&&!stato.giorno) stato.giorno=oggi(); render(); break;
    case "giorno": stato.giorno = spostaGiorno(stato.giorno, Number(el.dataset.n)); render(); break;
    case "mese": stato.mese = spostaMese(stato.mese, Number(el.dataset.n)); render(); break;
    case "apri": stato.giorno = el.dataset.g; stato.vista="giorno"; render(); break;
    case "riep": stato.riep = el.dataset.v; render(); break;
    case "liste": stato.liste = el.dataset.v; render(); break;
    case "chiudi": chiudiFoglio(); break;
    case "modifica": foglioTurno(db.turni.find(t=>t.id===id)); break;
    case "salvaT": {
      const t = leggiTurno();
      const v = db.turni.find(x=>x.id===id);
      if(!v){ toast("Turno non trovato"); return; }
      if(!t.risorsaId||!t.dalle||!t.alle){ toast("Scegli chi va a lavorare e metti dalle e alle"); return; }
      if(t.dalle===t.alle){ toast("Dalle e Alle sono uguali"); return; }
      if((t.dalle2&&!t.alle2)||(!t.dalle2&&t.alle2)){ toast("Secondo orario: servono sia Dalle 2 che Alle 2"); return; }
      if(t.risorsaB){
        if(!t.bDalle||!t.bAlle){ toast("Secondo operatore: metti dalle e alle"); return; }
        if(t.risorsaB===t.risorsaId){ toast("Il secondo operatore è la stessa persona"); return; }
      } else if(t.bDalle||t.bAlle){ toast("Hai messo gli orari del secondo ma non il nome"); return; }
      /*
       * Il monte ore dell'ufficio e' un tetto, non un consiglio: quello e'
       * quello che si paga. Sforarlo non si salva — niente "salvo lo stesso",
       * perche' una domanda a cui si risponde di corsa non e' un controllo.
       */
      const uff = minUfficio(v), fatte = minTurno(t);
      if(uff && fatte > uff){
        toast(`Non salvo: ${hm(fatte)} contro le ${hm(uff)} dell'ufficio. Togli ${hm(fatte-uff)}.`);
        return;
      }
      Object.assign(v, t);
      // Aprendolo e salvandolo se n'e' preso carico: il nome adesso e' suo
      delete v.uff;
      // Se l'ufficio aveva segnalato una modifica, aprendolo e salvando
      // l'ha vista: il segno si toglie. L'annullato invece resta.
      if(v.statoUff === "modificato") v.statoUff = "";
      salva(); chiudiFoglio(); render(); toast("Turno salvato"); break; }
    case "salvaParola": {
      const p = val("pwAgg");
      if(p.length < 6){ toast("La parola d'ordine è di almeno 6 caratteri"); return; }
      db.imp.parola = p; chiaveCache = null; salva(); chiudiFoglio(); render();
      controllaAggiornamenti(true); break; }
    case "aggiornaOra": controllaAggiornamenti(true); break;
    case "cambiaParola": foglioParola(false); break;
    case "leggiIncollato": {
      const pacco = trovaPacco(val("incolla"));
      if(!pacco){ toast("Nel testo non trovo i turni: incolla tutto il messaggio"); return; }
      caricaPacco(pacco); break; }
    case "faiImport": {
      if(!paccoInAttesa){ toast("Niente da importare"); return; }
      const e = applicaImport(paccoInAttesa);
      paccoInAttesa = null;
      chiudiFoglio();
      if(e.nuovi) { stato.vista = "giorno"; }
      render();
      toast(`${e.nuovi} nuovi · ${e.modificati} cambiati · ${e.annullati} annullati`);
      break; }
    case "nuovaR": foglioRisorsa(null); break;
    case "modR": foglioRisorsa(risorsa(id)); break;
    case "salvaR": {
      const nome = val("rNome"); if(!nome){ toast("Scrivi il nome"); return; }
      const dati = { nome, tel:val("rTel"), nascosto: !!document.getElementById("rNasc")?.checked };
      if(id) Object.assign(risorsa(id), dati); else db.risorse.push({ id:uid(), ...dati });
      salva(); chiudiFoglio(); render(); break; }
    case "eliminaR": {
      const n = db.turni.filter(t=>t.risorsaId===id).length;
      if(n){ alert(`Non si può eliminare: ha ${n} turni registrati.\nSpunta "Nascondi" se non lavora più con te.`); return; }
      if(confirm("Elimino questa risorsa?")){ db.risorse = db.risorse.filter(r=>r.id!==id); salva(); chiudiFoglio(); render(); } break; }
    /*
     * Qui stavano "nuovo servizio", "modifica" ed "elimina". Tolti: i posti
     * dove si lavora li decide l'ufficio e arrivano con i turni. Uno creato a
     * mano qui dentro non esisterebbe per nessun altro, e le ore finirebbero
     * su una riga che il gestionale non conosce.
     */
    case "csv": csvMese(); break;
    case "stampa": document.querySelectorAll("details").forEach(d=>d.open=true); setTimeout(()=>window.print(),100); break;
    case "cancellatutto":
      if(confirm("Cancello TUTTI i dati da questo telefono?") && confirm("Sicuro? I turni l'ufficio li rimanda, ma i nomi che hai messo tu e gli orari che hai corretto si perdono.")){ db = vuoto(); salva(); render(); }
      break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  const a = el.dataset.actChange;
  if(a==="sceglidata" && el.value){ stato.giorno = el.value; render(); }
  if(a==="sceglimese" && el.value){ stato.mese = el.value; render(); }
  if(a==="nome"){ db.imp.nome = el.value.trim(); salva(); document.getElementById("chi").textContent = db.imp.nome?`Capogruppo: ${db.imp.nome}`:""; toast("Nome salvato"); }
  if(el.id==="tDoppio"){ document.getElementById("boxDoppio").style.display = el.checked?"grid":"none"; }
  if(el.id==="tBDoppio"){ document.getElementById("boxBDoppio").style.display = el.checked?"grid":"none"; }
  if(el.id==="tInDue"){ document.getElementById("boxB").style.display = el.checked?"block":"none"; }
  // "Insieme": gli orari del secondo sono quelli del primo, e non si toccano
  if(el.id==="tInsieme" || (el.id==="tInDue" && el.checked)) sincronizzaInsieme();
  if((el.id==="tDa"||el.id==="tA"||el.id==="tDa2"||el.id==="tA2") && document.getElementById("tInsieme")?.checked) sincronizzaInsieme();
  if(el.closest("#foglio") && document.getElementById("tTot")) aggiornaTotTurno();
});
document.addEventListener("input", e => {
  if(e.target.closest("#foglio") && document.getElementById("tTot")) aggiornaTotTurno();

// Funzionamento senza internet (solo quando la pagina e' pubblicata su un sito)
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();

/**
 * Apre il pacchetto dell'ufficio e mostra il riepilogo. Se qualcosa non va lo
 * dice in chiaro, invece di lasciare l'app muta.
 */
async function caricaPacco(pacco){
  try{
    const dati = await apriPacco(pacco);
    if(!dati || !Array.isArray(dati.turni)) throw new Error("il messaggio non contiene turni");
    paccoInAttesa = dati;
    foglioImport(dati);
  }catch(e){
    alert("Non riesco a leggere i turni dell'ufficio.\n\n" + e.message + "\n\nChiedi all'ufficio di rimandare il messaggio.");
  }
}

/* =====================================================================
   AGGIORNAMENTO DA SOLO
   L'ufficio preme "Pubblica" e il file dei turni finisce sul sito. Qui lo si
   va a prendere da soli: all'apertura, quando si torna sull'app, e ogni tanto
   mentre e' aperta. Cosi' l'ufficio il link lo manda una volta sola.

   Il file sul sito e' PUBBLICO, quindi e' cifrato: dentro ci sono i nomi della
   squadra e gli indirizzi dei clienti. La parola d'ordine la da' l'ufficio a
   voce, si scrive una volta e resta su questo telefono. Senza quella il file
   e' una sfilza di lettere per chiunque, me compreso.
   ===================================================================== */

const ATTESA = 4*60*1000;        // ogni quanto riguardare, mentre l'app e' aperta
let chiaveCache = null;          // ricavare la chiave costa un attimo: si tiene
let controlloInCorso = false;
let ultimoControllo = 0;

/** Dalla parola d'ordine alla chiave. Stesso conto che fa il gestionale. */
async function derivaChiave(parola, salt, iter){
  const firma = `${parola}|${salt}|${iter}`;
  if(chiaveCache && chiaveCache.firma === firma) return chiaveCache.k;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:daBase64url(salt), iterations:iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  chiaveCache = { firma, k };
  return k;
}

/** Apre il file cifrato. Dentro c'e' lo stesso pacchetto del link. */
async function apriFileCifrato(file, parola){
  if(!file || file.v !== 1 || !file.dati) throw new Error("il file dei turni non e' in un formato che conosco");
  if(!crypto.subtle) throw new Error("questo telefono non sa aprire i file cifrati");
  const k = await derivaChiave(parola, file.salt, file.iter || 210000);
  let chiaro;
  try{
    chiaro = await crypto.subtle.decrypt({ name:"AES-GCM", iv:daBase64url(file.iv) }, k, daBase64url(file.dati));
  }catch(e){
    // Non si distingue parola sbagliata da file rovinato: e' giusto cosi',
    // ma quello che succede davvero e' quasi sempre la parola
    const err = new Error("parola d'ordine sbagliata"); err.parola = true; throw err;
  }
  return apriPacco(new TextDecoder().decode(chiaro));
}

/**
 * Va a vedere se l'ufficio ha pubblicato qualcosa di nuovo.
 *
 * `manuale` = l'ha chiesto lui col pulsante: allora si parla anche quando non
 * c'e' niente di nuovo. Da solo invece sta zitto, se no suonerebbe ogni volta
 * che si riapre l'app.
 */
async function controllaAggiornamenti(manuale){
  if(controlloInCorso) return;
  if(!db.imp.codice){ if(manuale) toast("Non hai ancora il link dell'ufficio"); return; }
  if(!db.imp.parola){ if(manuale) foglioParola(); return; }
  controlloInCorso = true;
  if(manuale) toast("Controllo…");
  try{
    // Niente scorciatoie del browser: si vuole il file di adesso
    let r;
    try{
      r = await fetch(`t-${db.imp.codice}.json`, { cache:"no-store" });
    }catch(e){
      // "Failed to fetch" non dice niente a nessuno: quasi sempre e' la rete
      throw new Error("non c'è internet, o il sito non risponde. I turni che hai restano, riprova più tardi.");
    }
    if(r.status === 404) throw new Error("l'ufficio non ha ancora pubblicato niente per te (codice " + db.imp.codice + ")");
    if(!r.ok) throw new Error("il sito ha risposto " + r.status);
    const file = await r.json();
    ultimoControllo = Date.now();

    // Gia' visto: l'ora e' l'unica cosa in chiaro, serve proprio a questo
    if(file.ts && file.ts === db.imp.tsAgg){
      db.imp.quandoAgg = new Date().toISOString(); salva();
      if(manuale){ toast("Sei già aggiornato"); render(); }
      return;
    }

    const dati = await apriFileCifrato(file, db.imp.parola);
    if(!dati || !Array.isArray(dati.turni)) throw new Error("dentro non ci sono turni");
    const e = applicaImport(dati);
    db.imp.tsAgg = file.ts || new Date().toISOString();
    db.imp.quandoAgg = new Date().toISOString();
    db.imp.esitoAgg = e;
    salva();
    render();
    const cambiati = e.nuovi + e.modificati + e.annullati;
    if(cambiati) toast(`Aggiornato: ${e.nuovi} nuovi · ${e.modificati} cambiati · ${e.annullati} annullati`);
    else if(manuale) toast("Sei già aggiornato");
  }catch(err){
    db.imp.erroreAgg = err.message; salva();
    if(err.parola){
      // Qui si ferma e si chiede: insistere da solo non serve a niente
      db.imp.parola = ""; salva(); render();
      if(manuale || document.visibilityState === "visible") foglioParola(true);
    } else if(manuale){
      toast("Non riesco ad aggiornare: " + err.message);
    }
  }finally{ controlloInCorso = false; }
}

/** La parola d'ordine: la si scrive una volta sola */
function foglioParola(sbagliata){
  apriFoglio(`<h2>Parola d'ordine</h2>
    <p class="muted" style="margin-top:0">${sbagliata
      ? "La parola non va bene: il file dell'ufficio non si apre. Richiedila all'ufficio e riprova."
      : "I turni dell'ufficio sono protetti. Scrivi la parola che ti ha dato l'ufficio: te la chiedo una volta sola."}</p>
    <label class="f">Parola d'ordine</label>
    <input class="i" id="pwAgg" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="come te l'ha dettata l'ufficio">
    <p class="muted">Resta su questo telefono. Serve solo ad aprire i turni, non e' la password di nessun sito.</p>
    <div class="btns" style="margin-top:14px"><button class="btn" data-act="chiudi">Dopo</button><button class="btn pri" data-act="salvaParola">Salva e scarica</button></div>`);
  setTimeout(()=>document.getElementById("pwAgg")?.focus(), 150);
}

// Quando torna sull'app, e ogni tanto mentre ce l'ha aperta davanti
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && Date.now() - ultimoControllo > 60000) controllaAggiornamenti(false);
});
setInterval(() => { if(document.visibilityState === "visible") controllaAggiornamenti(false); }, ATTESA);

// Link aperto da WhatsApp: i dati stanno dopo il cancelletto. Si toglie subito
// dall'indirizzo, cosi' ricaricando la pagina non si riapre tutto da capo.
//   #imp=...  il pacchetto intero dentro il link (la vecchia strada, resta)
//   #c=...    il codice: i turni stanno sul sito e me li vado a prendere io
(function(){
  const h = location.hash || "";
  const codice = (h.match(/#c=([A-Za-z0-9_-]{4,20})/) || [])[1];
  const pacco = trovaPacco(h);
  if(codice || pacco){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }

  if(codice){
    if(db.imp.codice !== codice){ db.imp.codice = codice; db.imp.tsAgg = ""; salva(); }
    if(!db.imp.parola) foglioParola(); else controllaAggiornamenti(true);
    return;
  }
  if(pacco){ caricaPacco(pacco); return; }
  // Apertura normale: si guarda se c'e' qualcosa di nuovo, senza disturbare
  if(db.imp.codice) controllaAggiornamenti(false);
})();
</script>
